    <link rel="stylesheet" href="event-form-style.css?v=3">
    <link rel="stylesheet" href="../assest/popup-notification.css?v=3">
</head>

<body>

        <aside class="sidebar">

            <div class="sidebar-lang-toggle">
                <a href="?lang=ar" class="sidebar-lang-btn">
                    <i class="ri-global-line"></i>
                    <span>العربية</span>
                </a>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="ri-dashboard-line"></i>
                    <span>Dashboard</span>
                </a>
                <a href="hero-manager.html" class="nav-item">
                    <i class="ri-image-line"></i>
                    <span>Hero Manager</span>
                </a>
                <a href="site-settings.html" class="nav-item">
                    <i class="ri-global-line"></i>
                    <span>Site Settings</span>
                </a>
                <a href="exhibitions.html" class="nav-item">
                    <i class="ri-gallery-upload-line"></i>
                    <span>Exhibitions</span>
                </a>
                <a href="events.html" class="nav-item">
                    <i class="ri-calendar-event-line"></i>
                    <span>Events</span>
                </a>
                <a href="blogs.html" class="nav-item">
                    <i class="ri-article-line"></i>
                    <span>Blogs</span>
                </a>
                <a href="press.html" class="nav-item">
                    <i class="ri-newspaper-line"></i>
                    <span>Press</span>
                </a>
                <a href="pricing.html" class="nav-item active">
                    <i class="ri-price-tag-3-line"></i>
                    <span>Pricing</span>
                </a>
                <a href="legal-pages.html" class="nav-item">
                    <i class="ri-file-text-line"></i>
                    <span>Legal Pages</span>
                </a>
                <a href="settings.html" class="nav-item">
                    <i class="ri-settings-3-line"></i>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="login.html" class="logout-btn">
                    <i class="ri-logout-box-line"></i>
                    <span>Logout</span>
                </a>
            </div>

        <main class="main-content">
            <a href="https://lakumartspace.com" target="_blank" class="admin-floating-btn" title="View Website">
                <i class="ri-external-link-line"></i>
            </a>

            <header>
                <h1><i class="ri-edit-line"></i> Edit Pricing</h1>
                <a href="pricing.html" class="btn-secondary"><i class="ri-arrow-left-line"></i> Back</a>
            </header>

            <div class="modern-form-container">
                <form method="POST" id="pricingForm">
                    <input type="hidden" name="id" id="pricingId">

                    <div class="form-section">
                        <h3><i class="ri-information-line"></i> Pricing Details</h3>

                        <!-- English Section -->
                        <div style="background: #f9f9f9; padding: 20px; border-radius: 8px; margin-bottom: 30px; border-left: 4px solid #000;">
                            <h4 style="margin: 0 0 16px 0; font-size: 1rem; font-weight: 600;">English</h4>
                            
                            <div class="form-group">
                                <label for="name_en" data-i18n="pricing_name_en">Price Name (EN) *</label>
                                <input type="text" id="name_en" name="name_en" placeholder="e.g., Hall 1, Meeting Room" required>
                            </div>

                            <div class="form-group">
                                <label for="description_en" data-i18n="pricing_description_en">Description (EN)</label>
                                <textarea id="description_en" name="description_en" rows="6" placeholder="Enter description in English..."></textarea>
                                <div class="char-count"><span id="charCount_en">0</span> characters</div>
                            </div>


                        </div>

                        <!-- Arabic Section -->
                        <div style="background: #f9f9f9; padding: 20px; border-radius: 8px; margin-bottom: 30px; border-left: 4px solid #999;">
                            <h4 style="margin: 0 0 16px 0; font-size: 1rem; font-weight: 600;">العربية</h4>
                            
                            <div class="form-group">
                                <label for="name_ar" data-i18n="pricing_name_ar">Price Name (AR) *</label>
                                <input type="text" id="name_ar" name="name_ar" placeholder="مثال: القاعة 1، غرفة الاجتماعات" required>
                            </div>

                            <div class="form-group">
                                <label for="description_ar" data-i18n="pricing_description_ar">Description (AR)</label>
                                <textarea id="description_ar" name="description_ar" rows="6" placeholder="أدخل الوصف بالعربية..." dir="rtl"></textarea>
                                <div class="char-count"><span id="charCount_ar">0</span> characters</div>
                            </div>


                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="price" data-i18n="pricing_amount">Amount</label>
                                <input type="text" id="price" name="price" placeholder="e.g., 12000">
                            </div>

                            <div class="form-group">
                                <label for="price_unit" data-i18n="pricing_price_unit">Duration</label>
                                <select id="price_unit" name="price_unit">
                                    <option value="SAR/day" data-i18n="pricing_price_unit_day_en">Per Day</option>
                                    <option value="SAR/hour" data-i18n="pricing_price_unit_hour_en">Per Hour</option>
                                    <option value="SAR" data-i18n="pricing_price_unit_fixed_en">Fixed Price</option>
                                </select>
                            </div>
                        </div>

                        <!-- Note: price_unit_ar is no longer used - duration is extracted from price_unit -->

                        <div class="form-group">
                            <label for="vat_note" data-i18n="pricing_vat_note_en">VAT Note</label>
                            <input type="text" id="vat_note" name="vat_note" value="*(excluding VAT)">
                        </div>

                        <div class="form-group">
                            <label for="price_sec">Secondary Price (for multiple rates)</label>
                            <input type="text" id="price_sec" name="price_sec" placeholder="e.g., Hall 1: 1,000 SAR/hour">
                        </div>

                        <div class="form-group">
                            <label for="vat_note_ar" data-i18n="pricing_vat_note_ar">VAT Note (AR)</label>
                            <input type="text" id="vat_note_ar" name="vat_note_ar" value="*(غير شامل الضريبة)" dir="rtl">
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="display_order">Display Order</label>
                                <input type="number" id="display_order" name="display_order" value="0">
                            </div>

                            <div class="form-group">
                                <label>Status</label>
                                <label style="display: flex; align-items: center; gap: 8px; margin-top: 10px; cursor: pointer;">
                                    <input type="checkbox" id="is_active" name="is_active" checked style="width: 18px; height: 18px;">
                                    Active (visible on website)
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="form-actions-modern">
                        <button type="submit" class="btn-primary-modern">
                            <i class="ri-check-line"></i> Update
                        </button>
                        <a href="pricing.html" class="btn-secondary-modern">
                            <i class="ri-close-line"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="config.js?v=2"></script>
    <script src="form-reset.js?v=2"></script>
    <script>
        // Translation system for pricing form
        let translations = {};
        let currentLang = 'en';

        async function loadTranslations(lang) {
            try {
                const response = await fetch(`../../lang/${lang}/shop.json`);
                if (!response.ok) throw new Error('Failed to load translations');
                translations = await response.json();
                currentLang = lang;
                updateFormTranslations();
            } catch (error) {
                console.error('Error loading translations:', error);
            }
        }

        function updateFormTranslations() {
            // Update all elements with data-i18n attribute
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[key]) {
                    if (element.tagName === 'OPTION') {
                        element.textContent = translations[key];
                    } else {
                        element.textContent = translations[key];
                    }
                }
            });

            // Update VAT note default value
            const vatNoteInput = document.getElementById('vat_note');
            if (vatNoteInput && currentLang === 'ar') {
                vatNoteInput.value = translations['pricing_vat_note_ar'] || '*(غير شامل الضريبة)';
            } else if (vatNoteInput) {
                vatNoteInput.value = translations['pricing_vat_note_en'] || '*(excluding VAT)';
            }
        }

        // Initialize translations on page load
        document.addEventListener('DOMContentLoaded', async function() {
            // Check URL for language parameter
            const params = new URLSearchParams(window.location.search);
            const lang = params.get('lang') || 'en';
            
            // Load translations
            await loadTranslations(lang);

            console.log('Edit Pricing Form Loaded');
            const pricingForm = document.getElementById('pricingForm');
            const priceInput = document.getElementById('price');
            const nameArField = document.getElementById('name_ar');
            
            console.log('Form found:', !!pricingForm);
            console.log('Name AR field found:', !!nameArField);
            console.log('Price input found:', !!priceInput);

            if (priceInput) {
                priceInput.addEventListener('input', function() {
                    this.value = this.value.replace(/[^\d]/g, '');
                });
            }

            // Character count for English
            const descEn = document.getElementById('description_en');
            const charCountEn = document.getElementById('charCount_en');
            if (descEn && charCountEn) {
                descEn.addEventListener('input', () => {
                    charCountEn.textContent = descEn.value.length;
                });
            }

            // Character count for Arabic
            const descAr = document.getElementById('description_ar');
            const charCountAr = document.getElementById('charCount_ar');
            if (descAr && charCountAr) {
                descAr.addEventListener('input', () => {
                    charCountAr.textContent = descAr.value.length;
                });
            }

            if (pricingForm) {
                pricingForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    
                    const name_en = document.getElementById('name_en').value.trim();
                    const name_ar = document.getElementById('name_ar').value.trim();
                    
                    if (!name_en) {
                        showPopup('Price name (English) is required', 'error');
                        return false;
                    }
                    if (!name_ar) {
                        showPopup('Price name (Arabic) is required', 'error');
                        return false;
                    }

                    const submitBtn = this.querySelector('button[type="submit"]');
                    if (submitBtn) {
                        submitBtn.innerHTML = '<i class="ri-loader-4-line"></i> Updating...';
                        submitBtn.disabled = true;
                    }

                    const updatedPricing = {
                        id: document.getElementById('pricingId').value,
                        name_en: name_en,
                        name_ar: name_ar,
                        description_en: document.getElementById('description_en').value.trim(),
                        description_ar: document.getElementById('description_ar').value.trim(),
                        price: document.getElementById('price').value.replace(/,/g, ''),
                        price_unit: document.getElementById('price_unit').value,
                        price_sec: document.getElementById('price_sec').value.trim(),
                        vat_note: document.getElementById('vat_note').value.trim(),
                        vat_note_ar: document.getElementById('vat_note_ar').value.trim(),
                        display_order: document.getElementById('display_order').value,
                        is_active: document.getElementById('is_active').checked ? '1' : '0'
                    };

                    try {
                        const response = await fetch(getApiUrl('edit_pricing.php'), {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(updatedPricing)
                        });

                        const data = await response.json();

                        if (data.success) {
                            showPopup('Pricing updated successfully!', 'success');
                            setTimeout(() => {
                                window.location.href = 'pricing.html';
                            }, 1500);
                        } else {
                            showPopup('Error: ' + (data.message || 'Failed to update pricing'), 'error');
                            if (submitBtn) {
                                submitBtn.innerHTML = '<i class="ri-check-line"></i> Update';
                                submitBtn.disabled = false;
                            }
                        }
                    } catch (error) {
                        console.error('Error updating pricing:', error);
                        showPopup('Error: ' + error.message, 'error');
                        if (submitBtn) {
                            submitBtn.innerHTML = '<i class="ri-check-line"></i> Update';
                            submitBtn.disabled = false;
                        }
                    }
                });
            }

            // Load pricing data
            loadPricing();
        });

        async function loadPricing() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            
            if (!id) {
                console.warn('No pricing ID provided');
                return;
            }

            try {
                const response = await fetch(getApiUrl('get_pricing_by_id.php') + '?id=' + id);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                
                if (data.success && data.data) {
                    populateForm(data.data);
                } else {
                    console.warn('Failed to load pricing data: ' + (data.message || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error loading pricing:', error);
            }
        }

        function populateForm(pricing) {
            document.getElementById('pricingId').value = pricing.id;
            document.getElementById('name_en').value = pricing.name_en || pricing.title || '';
            document.getElementById('description_en').value = pricing.description_en || '';
            
            document.getElementById('name_ar').value = pricing.name_ar || '';
            document.getElementById('description_ar').value = pricing.description_ar || '';
            
            document.getElementById('price').value = pricing.price || '';
            document.getElementById('price_unit').value = pricing.price_unit || 'SAR/day';
            document.getElementById('price_sec').value = pricing.price_sec || '';
            document.getElementById('vat_note').value = pricing.vat_note || '*(excluding VAT)';
            document.getElementById('vat_note_ar').value = pricing.vat_note_ar || '*(غير شامل الضريبة)';
            document.getElementById('display_order').value = pricing.display_order || 0;
            document.getElementById('is_active').checked = pricing.is_active;
            
            // Update character counts
            document.getElementById('charCount_en').textContent = (pricing.description_en || '').length;
            document.getElementById('charCount_ar').textContent = (pricing.description_ar || '').length;
        }

        function getApiUrl(endpoint) {
            const baseUrl = window.location.pathname.split('/admin/')[0];
            return baseUrl + '/api/' + endpoint;
        }
    </script>

    <script src="../assest/popup-notification.js?v=6.0.0" defer></script>
