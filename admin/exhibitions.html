.admin-container { display: flex; min-height: 100vh; }

.exhibitions-table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.exhibitions-table th { background: #f6f6eb; padding: 15px; text-align: left; font-weight: 500; border-bottom: 1px solid #e0e0e0; }
.exhibitions-table td { padding: 15px; border-bottom: 1px solid #e0e0e0; }
.exhibitions-table tbody tr:hover { background: #f9f9f9; }
.action-buttons { display: flex; gap: 10px; }
.btn-edit, .btn-delete { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
.btn-edit { background: #2e7d32; color: white; }
.btn-delete { background: #c2185b; color: white; }
.btn-add { background: #1a1a1a; color: white; padding: 12px 24px; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 20px; }
.badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; }
.badge.upcoming { background: rgba(46,125,50,0.1); color: #2e7d32; }
.badge.past { background: rgba(194,24,91,0.1); color: #c2185b; }
</style>
</head>

</div>

<main class="main-content">
    <!-- Floating View Website Button -->
    <a href="https://lakumartspace.com" target="_blank" class="admin-floating-btn" title="View Website">
        <i class="ri-external-link-line"></i>
    </a>

        <h1><i class="ri-gallery-upload-line"></i> Exhibitions Management</h1>
    </header>

    <div style="margin-bottom: 20px;">
        <a href="add-exhibition.html" class="btn-primary" style="display: inline-block; padding: 10px 20px; background: #1a1a1a; color: white; text-decoration: none; border-radius: 4px;">
            <i class="ri-add-line"></i> Add Exhibition

    </div>

    <div class="recent-events">

        <table class="exhibitions-table">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Date</th>
                    <th>Location</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="exhibitionsTableBody">
                <tr><td colspan="5" style="text-align: center; padding: 20px;">Loading...</td></tr>
            </tbody>
        </table>
    </div>

<!-- Exhibition Details Modal -->
<div id="exhibitionModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
  <div style="background: white; border-radius: 8px; padding: 40px; max-width: 700px; width: 90%; max-height: 80vh; overflow-y: auto; position: relative;">
    <button onclick="exhibitionsManagement.closeModal()" style="position: absolute; top: 20px; right: 20px; background: none; border: none; font-size: 24px; cursor: pointer;">×</button>
    <div id="exhibitionModalContent"></div>
  </div>
</div>
</main>
</div>

<script>
class ExhibitionsManagement {
  constructor() {
    this.exhibitions = [];
    this.filteredExhibitions = [];
    this.currentFilter = 'past';
    this.init();
  }

  async init() {
    await this.loadExhibitions();
    this.filterExhibitions('past');
    this.setupEventListeners();
  }

  async loadExhibitions() {
    try {
      const response = await fetch('../api/get_exhibitions.php?type=all');
      const data = await response.json();
      
      if (data.success && data.data) {
        this.exhibitions = data.data;
      } else {
        this.exhibitions = [];
      }
    } catch (error) {
      console.error('Error loading exhibitions:', error);
      this.exhibitions = [];
    }
    
    this.render();
  }

  setupEventListeners() {
    document.addEventListener('click', (e) => {
      if (e.target.classList.contains('btn-delete')) {
        const exhibitionId = e.target.dataset.id;
        if (confirm('Are you sure you want to delete this exhibition?')) {
          this.deleteExhibition(exhibitionId);
        }
      }
    });
  }

  async deleteExhibition(exhibitionId) {
    try {
      const response = await fetch('../api/delete_exhibition.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: exhibitionId })
      });
      
      const data = await response.json();
      if (data.success) {
        this.showAlert('Exhibition deleted successfully', 'success');
        this.exhibitions = this.exhibitions.filter(e => e.id !== exhibitionId);
        this.filterExhibitions('past');
        this.render();
      } else {
        this.showAlert('Error deleting exhibition', 'error');
      }
    } catch (error) {
      this.showAlert('Error deleting exhibition', 'error');
    }
  }

  showAlert(message, type) {
    const alertContainer = document.getElementById('alertContainer');
    const alert = document.createElement('div');
    alert.className = `alert alert-${type}`;
    alert.textContent = message;
    alert.style.cssText = `
      padding: 15px 20px;
      margin-bottom: 20px;
      background: ${type === 'success' ? '#4caf50' : '#f44336'};
      color: white;
      border-radius: 4px;
    `;
    alertContainer.appendChild(alert);
    
    setTimeout(() => alert.remove(), 3000);
  }

  filterExhibitions(filter) {
    this.currentFilter = filter;

    const now = new Date();
    if (filter === 'past') {
      this.filteredExhibitions = this.exhibitions.filter(e => new Date(e.exhibition_date) < now);
    } else {
      this.filteredExhibitions = this.exhibitions;
    }

    this.render();
  }

  render() {
    const tbody = document.getElementById('exhibitionsTableBody');
    const exhibitionsToDisplay = this.filteredExhibitions.length > 0 ? this.filteredExhibitions : [];
    
    if (exhibitionsToDisplay.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 40px;">No past exhibitions found</td></tr>';
      return;
    }

    tbody.innerHTML = exhibitionsToDisplay.map(exhibition => {
      const exhibitionDate = new Date(exhibition.exhibition_date);

      return `
        <tr onclick="exhibitionsManagement.openModal(${exhibition.id})" style="cursor: pointer;">
          <td><strong>${exhibition.title_en}</strong></td>
          <td>${exhibitionDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</td>
          <td>${exhibition.location_en}</td>
          <td><span class="badge past">Past</span></td>
          <td onclick="event.stopPropagation();">
            <div class="action-buttons">
              <a href="edit-exhibition.html?id=${exhibition.id}" class="btn-edit"><i class="ri-edit-line"></i> Edit</a>
              <button class="btn-delete" data-id="${exhibition.id}"><i class="ri-delete-line"></i> Delete</button>
            </div>
          </td>
        </tr>
      `;
    }).join('');
  }

  openModal(exhibitionId) {
    const exhibition = this.exhibitions.find(e => e.id == exhibitionId);
    if (!exhibition) return;

    const exhibitionDate = new Date(exhibition.exhibition_date);
    const fullDateStr = exhibitionDate.toLocaleDateString('en-US', { 
      weekday: 'long',
      year: 'numeric', 
      month: 'long', 
      day: 'numeric' 
    });

    const content = document.getElementById('exhibitionModalContent');
    content.innerHTML = `
      <h2 style="margin-bottom: 20px; font-size: 24px;">${exhibition.title_en}</h2>
      
      <div style="margin-bottom: 20px;">
        <img src="${exhibition.cover_image || '../assest/img-4.png'}" alt="${exhibition.title_en}" style="width: 100%; height: 300px; object-fit: cover; border-radius: 8px;">
      </div>

      <div style="background: #f6f6eb; padding: 20px; border-radius: 8px; margin-bottom: 20px;">
        <div style="margin-bottom: 15px;">
          <label style="font-weight: 600; color: #1a1a1a;">Exhibition Title</label>
          <p style="margin: 5px 0; color: #555;">${exhibition.title_en}</p>
        </div>

        <div style="margin-bottom: 15px;">
          <label style="font-weight: 600; color: #1a1a1a;">Date</label>
          <p style="margin: 5px 0; color: #555;">${fullDateStr}</p>
        </div>

        <div style="margin-bottom: 15px;">
          <label style="font-weight: 600; color: #1a1a1a;">Time</label>
          <p style="margin: 5px 0; color: #555;">${exhibition.exhibition_time || 'N/A'} - ${exhibition.exhibition_end_time || 'N/A'}</p>
        </div>

        <div style="margin-bottom: 15px;">
          <label style="font-weight: 600; color: #1a1a1a;">Location</label>
          <p style="margin: 5px 0; color: #555;">${exhibition.location_en}</p>
        </div>

        <div style="margin-bottom: 15px;">
          <label style="font-weight: 600; color: #1a1a1a;">Status</label>
          <p style="margin: 5px 0; color: #555;">Past</p>
        </div>

        <div style="margin-bottom: 15px;">
          <label style="font-weight: 600; color: #1a1a1a;">Description</label>
          <p style="margin: 5px 0; color: #555; line-height: 1.6;">${exhibition.description_en || 'No description'}</p>
        </div>

        <div>
          <label style="font-weight: 600; color: #1a1a1a;">Exhibition ID</label>
          <p style="margin: 5px 0; color: #999; font-size: 12px;">#${exhibition.id}</p>
        </div>
      </div>

      <div style="display: flex; gap: 10px;">
        <a href="edit-exhibition.html?id=${exhibition.id}" class="btn-edit" style="flex: 1; text-align: center; padding: 12px; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px;">
          <i class="ri-edit-line"></i> Edit Exhibition
        </a>
        <button onclick="exhibitionsManagement.deleteExhibition(${exhibition.id})" class="btn-delete" style="flex: 1; padding: 12px;">
          <i class="ri-delete-line"></i> Delete Exhibition
        </button>
      </div>
    `;

    const modal = document.getElementById('exhibitionModal');
    modal.style.display = 'flex';
  }

  closeModal() {
    const modal = document.getElementById('exhibitionModal');
    modal.style.display = 'none';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  window.exhibitionsManagement = new ExhibitionsManagement();
});
</script>

})();
</script>
