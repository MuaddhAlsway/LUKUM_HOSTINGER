<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exhibitions - LAKUM</title>
    <link rel="icon" href="../../assest/favicon.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="admin-style.css">
    <link rel="stylesheet" href="../assest/popup-notification.css">
    <link rel="stylesheet" href="../assest/confirmation-popup.css">
</head>

<body>
    <div class="admin-container">
        <aside class="sidebar">
            <div class="logo">
                <h3 style="font-size: 24px; font-weight: 300; letter-spacing: 2px; margin: 0;">LAKUM</h3>
            </div>
            <div class="sidebar-lang-toggle">
                <a href="?lang=ar" class="sidebar-lang-btn">
                    <i class="ri-global-line"></i>
                    <span>العربية</span>
                </a>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><i class="ri-dashboard-line"></i><span>Dashboard</span></a>
                <a href="hero-manager.html" class="nav-item">
                    <i class="ri-image-line"></i>
                    <span>Hero Manager</span>
                </a>
                <a href="site-settings.html" class="nav-item">
                    <i class="ri-global-line"></i>
                    <span>Site Settings</span>
                </a>
                <a href="exhibitions.html" class="nav-item active"><i class="ri-gallery-upload-line"></i><span>Exhibitions</span></a>
                <a href="events.html" class="nav-item"><i class="ri-calendar-event-line"></i><span>Events</span></a>
                <a href="blogs.html" class="nav-item"><i class="ri-article-line"></i><span>Blogs</span></a>
                <a href="press.html" class="nav-item"><i class="ri-newspaper-line"></i><span>Press</span></a>
                <a href="pricing.html" class="nav-item"><i class="ri-price-tag-3-line"></i><span>Pricing</span></a>
                <a href="legal-pages.html" class="nav-item"><i class="ri-file-text-line"></i><span>Legal Pages</span></a>
                <a href="settings.html" class="nav-item"><i class="ri-settings-3-line"></i><span>Settings</span></a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" class="logout-btn" onclick="logout(); return false;"><i class="ri-logout-box-line"></i><span>Logout</span></a>
            </div>
        </aside>

        <main class="main-content">
            <a href="https://lakumartspace.com" target="_blank" class="admin-floating-btn" title="View Website">
                <i class="ri-external-link-line"></i>
            </a>

            <header>
                <h1><i class="ri-gallery-upload-line"></i> Exhibitions</h1>
                <div style="display: flex; gap: 10px;">
                    <a href="add-exhibition.html" class="btn-primary"><i class="ri-add-line"></i> Add Exhibition</a>
                </div>
            </header>

            <div class="list-container">
                <div id="alertContainer"></div>

                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Date</th>
                            <th>Location</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="exhibitionsTableBody">
                        <tr>
                            <td colspan="5" style="text-align: center; padding: 40px;">Loading exhibitions...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Exhibition Details Modal -->
    <div id="exhibitionModal" class="confirmation-modal" style="display: none;">
        <div class="confirmation-modal-content">
            <button onclick="closeExhibitionModal()" style="position: absolute; top: 20px; right: 20px; background: none; border: none; font-size: 24px; cursor: pointer;">×</button>
            <div id="exhibitionModalContent"></div>
        </div>
    </div>

    <script src="../assest/popup-notification.js?v=5.0.0" defer></script>
    <script src="../assest/confirmation-popup.js?v=1.0.0" defer></script>
    <script src="../assest/logout-confirmation-popup.js?v=1.0.0" defer></script>

    <script>
        let allExhibitions = [];

        // Check if user is logged in
        (function() {
            const isLoggedIn = sessionStorage.getItem('admin_logged_in') === 'true';
            if (!isLoggedIn) {
                window.location.href = 'login.html';
            }
        })();

        // Load exhibitions on page load
        async function loadExhibitions() {
            try {
                const response = await fetch('../api/get_exhibitions.php?type=all');
                const data = await response.json();
                
                if (data.success && data.data) {
                    allExhibitions = data.data;
                } else {
                    allExhibitions = [];
                }
                
                renderExhibitions();
            } catch (error) {
                console.error('Error loading exhibitions:', error);
                allExhibitions = [];
                renderExhibitions();
            }
        }

        // Filter to show only past exhibitions
        function getPastExhibitions() {
            const now = new Date();
            now.setHours(0, 0, 0, 0);  // Set to midnight to compare dates only
            return allExhibitions.filter(e => {
                const exhibitionDate = new Date(e.exhibition_date);
                exhibitionDate.setHours(0, 0, 0, 0);  // Set to midnight
                return exhibitionDate <= now;
            });
        }

        // Render exhibitions table
        function renderExhibitions() {
            const tbody = document.getElementById('exhibitionsTableBody');
            const pastExhibitions = getPastExhibitions();
            
            if (pastExhibitions.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 40px;">No past exhibitions found</td></tr>';
                return;
            }

            tbody.innerHTML = pastExhibitions.map(exhibition => {
                const exhibitionDate = new Date(exhibition.exhibition_date);
                const editLink = 'edit-exhibition.html?id=' + exhibition.id;
                return `
                    <tr>
                        <td><strong>${exhibition.title_en}</strong></td>
                        <td>${exhibitionDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</td>
                        <td>${exhibition.location_en}</td>
                        <td><span style="background: rgba(194,24,91,0.1); color: #c2185b; padding: 4px 8px; border-radius: 4px; font-size: 12px;">Past</span></td>
                        <td>
                            <a href="${editLink}" target="_self" class="btn-small" style="background: #2e7d32; color: white; padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 12px; display: inline-block;">Edit</a>
                            <button onclick="deleteExhibition(${exhibition.id}, '${exhibition.title_en}')" class="btn-small" style="background: #c2185b; color: white; padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; margin-left: 5px;">Delete</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Delete exhibition
        async function deleteExhibition(id, title) {
            if (!confirm(`Delete exhibition "${title}"?`)) return;
            
            try {
                const response = await fetch('../api/delete_exhibition.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id })
                });
                
                const data = await response.json();
                if (data.success) {
                    showAlert('Exhibition deleted successfully', 'success');
                    allExhibitions = allExhibitions.filter(e => e.id !== id);
                    renderExhibitions();
                } else {
                    showAlert('Error deleting exhibition', 'error');
                }
            } catch (error) {
                showAlert('Error deleting exhibition', 'error');
            }
        }

        // Show alert
        function showAlert(message, type) {
            const alertContainer = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.textContent = message;
            alert.style.cssText = `
                padding: 15px 20px;
                margin-bottom: 20px;
                background: ${type === 'success' ? '#4caf50' : '#f44336'};
                color: white;
                border-radius: 4px;
            `;
            alertContainer.appendChild(alert);
            
            setTimeout(() => alert.remove(), 3000);
        }

        // Close modal
        function closeExhibitionModal() {
            document.getElementById('exhibitionModal').style.display = 'none';
        }

        // Load exhibitions when page loads
        document.addEventListener('DOMContentLoaded', loadExhibitions);
    </script>

</body>
</html>
