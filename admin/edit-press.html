<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Press - LAKUM</title>
    <link rel="icon" href="../../assest/favicon.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="admin-style.css">
    <link rel="stylesheet" href="event-form-style.css">
    <link rel="stylesheet" href="../assest/popup-notification.css">
    <style>
        #press-editor {
            width: 100%;
            min-height: 400px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            resize: vertical;
        }
    </style>
</head>

<body>
    <div class="admin-container">
        <aside class="sidebar">
            <div class="logo">
                <h3 style="font-size: 24px; font-weight: 300; letter-spacing: 2px; margin: 0;">LAKUM</h3>
            </div>

            <div class="sidebar-lang-toggle">
                <a href="?lang=ar" class="sidebar-lang-btn">
                    <i class="ri-global-line"></i>
                    <span>العربية</span>
                </a>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="ri-dashboard-line"></i>
                    <span>Dashboard</span>
                </a>
                <a href="hero-manager.html" class="nav-item">
                    <i class="ri-image-line"></i>
                    <span>Hero Manager</span>
                </a>
                <a href="events.html" class="nav-item">
                    <i class="ri-calendar-event-line"></i>
                    <span>Events</span>
                </a>
                <a href="blogs.html" class="nav-item">
                    <i class="ri-article-line"></i>
                    <span>Blogs</span>
                </a>
                <a href="press.html" class="nav-item active">
                    <i class="ri-newspaper-line"></i>
                    <span>Press</span>
                </a>
                <a href="pricing.html" class="nav-item">
                    <i class="ri-price-tag-3-line"></i>
                    <span>Pricing</span>
                </a>
                <a href="legal-pages.html" class="nav-item">
                    <i class="ri-file-text-line"></i>
                    <span>Legal Pages</span>
                </a>
                <a href="settings.html" class="nav-item">
                    <i class="ri-settings-3-line"></i>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="login.html" class="logout-btn">
                    <i class="ri-logout-box-line"></i>
                    <span>Logout</span>
                </a>
            </div>
        </aside>

        <main class="main-content">
            <a href="https://lakumartspace.com" target="_blank" class="admin-floating-btn" title="View Website">
                <i class="ri-external-link-line"></i>
            </a>

            <header>
                <h1><i class="ri-edit-line"></i> Edit Press</h1>
                <a href="press.html" class="btn-secondary"><i class="ri-arrow-left-line"></i> Back</a>
            </header>

            <div class="modern-form-container">
                <form method="POST" enctype="multipart/form-data" id="pressForm">
                    <input type="hidden" name="id" id="pressId">

                    <!-- Cover Image Section -->
                    <div class="cover-upload-section">
                        <div class="cover-preview" id="coverPreview">
                            <div class="cover-placeholder">
                                <i class="ri-image-add-line"></i>
                                <p>Click to upload cover image</p>
                                <span>Recommended: 1200x800px</span>
                            </div>
                            <img id="coverImg" style="display: none;">
                            <button type="button" class="remove-cover" id="removeCover" style="display: none;">
                                <i class="ri-close-line"></i>
                            </button>
                        </div>
                        <input type="file" id="cover_image" name="cover_image" accept="image/*,.jpg,.jpeg,.png,.gif,.webp,.heic,.heif" style="display: none;">
                    </div>

                    <!-- Press Details -->
                    <div class="form-section">
                        <h3><i class="ri-information-line"></i> Press Details</h3>

                        <!-- English Section -->
                        <div style="background: #f9f9f9; padding: 20px; border-radius: 8px; margin-bottom: 30px; border-left: 4px solid #000;">
                            <h4 style="margin: 0 0 16px 0; font-size: 1rem; font-weight: 600;">English</h4>
                            
                            <div class="form-group">
                                <label for="title_en">Press Title (EN) *</label>
                                <input type="text" id="title_en" name="title_en" placeholder="Enter press title in English" required>
                            </div>

                            <div class="form-group">
                                <label for="content_en">Content (EN) *</label>
                                <textarea id="content_en" name="content_en" rows="8" placeholder="Write your press content in English..." required></textarea>
                                <div class="char-count"><span id="charCount_en">0</span> characters</div>
                            </div>

                            <div class="form-group">
                                <label for="excerpt_en">Excerpt (EN)</label>
                                <textarea id="excerpt_en" name="excerpt_en" rows="3" placeholder="Brief summary in English..."></textarea>
                            </div>
                        </div>

                        <!-- Arabic Section -->
                        <div style="background: #f9f9f9; padding: 20px; border-radius: 8px; margin-bottom: 30px; border-left: 4px solid #999;">
                            <h4 style="margin: 0 0 16px 0; font-size: 1rem; font-weight: 600;">العربية</h4>
                            
                            <div class="form-group">
                                <label for="title_ar">Press Title (AR) *</label>
                                <input type="text" id="title_ar" name="title_ar" placeholder="أدخل عنوان الخبر بالعربية">
                            </div>

                            <div class="form-group">
                                <label for="content_ar">Content (AR) *</label>
                                <textarea id="content_ar" name="content_ar" rows="8" placeholder="اكتب محتوى الخبر بالعربية..." dir="rtl"></textarea>
                                <div class="char-count"><span id="charCount_ar">0</span> characters</div>
                            </div>

                            <div class="form-group">
                                <label for="excerpt_ar">Excerpt (AR)</label>
                                <textarea id="excerpt_ar" name="excerpt_ar" rows="3" placeholder="ملخص موجز بالعربية..." dir="rtl"></textarea>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="source">Source/Publication</label>
                            <input type="text" id="source" name="source" placeholder="e.g., Arab News, Al Jazeera">
                        </div>

                        <div class="form-group">
                            <label for="press_date">Publish Date</label>
                            <input type="date" id="press_date" name="press_date">
                        </div>

                        <div class="form-group">
                            <label for="url">External Link</label>
                            <input type="url" id="url" name="url" placeholder="https://example.com/article">
                        </div>
                    </div>

                    <!-- Form Actions -->
                    <div class="form-actions-modern">
                        <button type="submit" class="btn-primary-modern" id="submitBtn">
                            <i class="ri-check-line"></i> Update                        </button>
                        <a href="press.html" class="btn-secondary-modern">
                            <i class="ri-close-line"></i> Cancel                        </a>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        // Cover Image Upload
        const coverPreview = document.getElementById('coverPreview');
        const coverInput = document.getElementById('cover_image');
        const coverImg = document.getElementById('coverImg');
        const removeCoverBtn = document.getElementById('removeCover');

        if (coverPreview && coverInput) {
            coverPreview.addEventListener('click', () => {
                coverInput.click();
            });

            coverInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        coverImg.src = e.target.result;
                        coverImg.style.display = 'block';
                        if (removeCoverBtn) {
                            removeCoverBtn.style.display = 'flex';
                        }
                        const placeholder = coverPreview.querySelector('.cover-placeholder');
                        if (placeholder) {
                            placeholder.style.display = 'none';
                        }
                    };
                    reader.readAsDataURL(file);
                }
            });

            if (removeCoverBtn) {
                removeCoverBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    coverInput.value = '';
                    coverImg.style.display = 'none';
                    coverImg.src = '';
                    removeCoverBtn.style.display = 'none';
                    const placeholder = coverPreview.querySelector('.cover-placeholder');
                    if (placeholder) {
                        placeholder.style.display = 'flex';
                    }
                });
            }
        }

        // Load press data
        async function loadPress() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            
            console.log('Loading press with ID:', id);
            
            if (!id) {
                console.error('No press ID provided in URL');
                alert('No press ID provided');
                window.location.href = 'press.html';
                return;
            }

            try {
                // Fetch with lang=en to get all bilingual data
                // Add cache-busting parameter to force fresh data
                const timestamp = new Date().getTime();
                const apiUrl = `../api/get_press_by_id.php?id=${id}&lang=en&t=${timestamp}`;
                console.log('Fetching from:', apiUrl);
                
                const response = await fetch(apiUrl, {
                    method: 'GET',
                    headers: {
                        'Cache-Control': 'no-cache, no-store, must-revalidate',
                        'Pragma': 'no-cache',
                        'Expires': '0'
                    }
                });
                console.log('Response status:', response.status);
                console.log('Response ok:', response.ok);
                
                const data = await response.json();
                console.log('API Response:', data);
                console.log('Data type:', typeof data.data);
                console.log('Is array:', Array.isArray(data.data));
                
                if (data.success && data.data) {
                    // Handle both object and array responses
                    const pressData = Array.isArray(data.data) ? data.data[0] : data.data;
                    console.log('Press data loaded successfully');
                    console.log('Press object:', pressData);
                    populateForm(pressData);
                } else {
                    console.error('API returned error:', data.message);
                    alert('Press not found: ' + (data.message || 'Unknown error'));
                    window.location.href = 'press.html';
                }
            } catch (error) {
                console.error('Error loading press:', error);
                alert('Error loading press data: ' + error.message);
            }
        }

        function populateForm(press) {
            if (!press) {
                console.error('No press data provided');
                alert('Error: No press data');
                return;
            }
            
            console.log('Populating form with press data:', press);
            console.log('Checking form elements...');
            
            // Use setTimeout to ensure DOM is ready
            setTimeout(() => {
                try {
                    // Check if elements exist
                    const pressIdEl = document.getElementById('pressId');
                    const titleEnEl = document.getElementById('title_en');
                    const titleArEl = document.getElementById('title_ar');
                    
                    console.log('pressId element:', pressIdEl);
                    console.log('title_en element:', titleEnEl);
                    console.log('title_ar element:', titleArEl);
                    
                    if (!titleEnEl) {
                        console.error('title_en element not found!');
                        return;
                    }
                    if (!titleArEl) {
                        console.error('title_ar element not found!');
                        return;
                    }
                    
                    document.getElementById('pressId').value = press.id || '';
                    console.log('Set pressId to:', press.id);
                    
                    // Populate English fields
                    document.getElementById('title_en').value = press.title_en || '';
                    console.log('Set title_en to:', press.title_en);
                    
                    document.getElementById('content_en').value = press.content_en || '';
                    console.log('Set content_en to:', press.content_en);
                    
                    document.getElementById('excerpt_en').value = press.excerpt_en || '';
                    console.log('Set excerpt_en to:', press.excerpt_en);
                    
                    // Populate Arabic fields
                    document.getElementById('title_ar').value = press.title_ar || '';
                    console.log('Set title_ar to:', press.title_ar);
                    
                    document.getElementById('content_ar').value = press.content_ar || '';
                    console.log('Set content_ar to:', press.content_ar);
                    
                    document.getElementById('excerpt_ar').value = press.excerpt_ar || '';
                    console.log('Set excerpt_ar to:', press.excerpt_ar);
                    
                    // Populate common fields
                    document.getElementById('source').value = press.source || '';
                    console.log('Set source to:', press.source);
                    
                    document.getElementById('press_date').value = press.press_date || '';
                    console.log('Set press_date to:', press.press_date);
                    
                    document.getElementById('url').value = press.url || '';
                    console.log('Set url to:', press.url);
                    
                    console.log('All fields populated successfully!');
                    
                    if (press.cover_image) {
                        const coverImg = document.getElementById('coverImg');
                        let imagePath = press.cover_image;
                        
                        // Handle different path formats
                        if (imagePath.startsWith('http')) {
                            // Already an absolute URL
                            coverImg.src = imagePath;
                        } else if (imagePath.startsWith('/')) {
                            // Absolute path from root
                            coverImg.src = imagePath;
                        } else {
                            // Relative path - prepend ../
                            coverImg.src = '../' + imagePath;
                        }
                        
                        coverImg.style.display = 'block';
                        const placeholder = document.querySelector('.cover-placeholder');
                        if (placeholder) placeholder.style.display = 'none';
                        document.getElementById('removeCover').style.display = 'flex';
                        console.log('Cover image set to:', coverImg.src);
                    }
                } catch (error) {
                    console.error('Error populating form:', error);
                    alert('Error populating form: ' + error.message);
                }
            }, 100);
        }

        // Handle form submission
        document.getElementById('pressForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Validate required fields
            const title_en = document.getElementById('title_en').value.trim();
            const title_ar = document.getElementById('title_ar').value.trim();
            const content_en = document.getElementById('content_en').value.trim();
            const content_ar = document.getElementById('content_ar').value.trim();
            
            if (!title_en) {
                alert('Press title (English) is required');
                return;
            }
            if (!title_ar) {
                alert('Press title (Arabic) is required');
                return;
            }
            if (!content_en) {
                alert('Press content (English) is required');
                return;
            }
            if (!content_ar) {
                alert('Press content (Arabic) is required');
                return;
            }

            let coverImagePath = null;

            // Handle cover image upload if changed
            if (coverInput.files.length > 0) {
                const uploadFormData = new FormData();
                uploadFormData.append('file', coverInput.files[0]);
                
                try {
                    const uploadResponse = await fetch('../api/upload_cover_image.php', {
                        method: 'POST',
                        body: uploadFormData
                    });
                    
                    const uploadResult = await uploadResponse.json();
                    if (uploadResult.success) {
                        coverImagePath = uploadResult.path;
                    } else {
                        throw new Error(uploadResult.message || 'Image upload failed');
                    }
                } catch (error) {
                    alert('Error uploading image: ' + error.message);
                    return;
                }
            }

            // Build JSON data
            const pressData = {
                id: document.getElementById('pressId').value,
                title_en: title_en,
                title_ar: title_ar,
                content_en: content_en,
                content_ar: content_ar,
                excerpt_en: document.getElementById('excerpt_en').value.trim(),
                excerpt_ar: document.getElementById('excerpt_ar').value.trim(),
                source: document.getElementById('source').value.trim(),
                press_date: document.getElementById('press_date').value,
                url: document.getElementById('url').value.trim()
            };

            // Only include cover_image if it was updated
            if (coverImagePath) {
                pressData.cover_image = coverImagePath;
            }

            try {
                console.log('Submitting form to: ../api/edit_press.php');
                
                const response = await fetch('../api/edit_press.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(pressData)
                });

                console.log('Response status:', response.status);
                const result = await response.json();
                console.log('API Response:', result);
                
                if (result.success) {
                    alert('Press updated successfully');
                    window.location.href = 'press.html';
                } else {
                    alert('Error updating press: ' + (result.message || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error updating press:', error);
                alert('Error updating press. Please try again: ' + error.message);
            }
        });

        window.addEventListener('load', loadPress);
    </script>
    <script src="form-reset.js"></script>
</body>

</html>
