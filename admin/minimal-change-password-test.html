<!DOCTYPE html>
<html>
<head>
    <title>Minimal Change Password Test</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        input { padding: 8px; margin: 5px 0; width: 200px; }
        button { padding: 10px 20px; font-size: 16px; }
        pre { background: #f0f0f0; padding: 10px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Minimal Change Password Test</h1>
    
    <div>
        <label>Current Password:</label><br>
        <input type="password" id="oldPass" value="admin123">
    </div>
    
    <div>
        <label>New Password:</label><br>
        <input type="password" id="newPass" value="newpass123">
    </div>
    
    <div>
        <label>Confirm Password:</label><br>
        <input type="password" id="confirmPass" value="newpass123">
    </div>
    
    <button onclick="submitForm()">Submit</button>
    
    <h2>Response:</h2>
    <pre id="response">Click Submit to test...</pre>

    <script>
        async function submitForm() {
            const responseDiv = document.getElementById('response');
            responseDiv.textContent = 'Sending request...';
            
            const oldPass = document.getElementById('oldPass').value;
            const newPass = document.getElementById('newPass').value;
            const confirmPass = document.getElementById('confirmPass').value;
            
            const payload = {
                old_password: oldPass,
                new_password: newPass,
                confirm_password: confirmPass
            };
            
            const jsonString = JSON.stringify(payload);
            
            console.log('Payload:', payload);
            console.log('JSON String:', jsonString);
            console.log('JSON String length:', jsonString.length);
            
            try {
                const response = await fetch('change_password.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: jsonString,
                    credentials: 'same-origin'
                });
                
                console.log('Response status:', response.status);
                const text = await response.text();
                console.log('Response text:', text);
                
                responseDiv.textContent = text;
                
                try {
                    const data = JSON.parse(text);
                    if (data.success) {
                        responseDiv.textContent = 'SUCCESS: ' + data.message;
                    } else {
                        responseDiv.textContent = 'ERROR: ' + data.message;
                        if (data.debug) {
                            responseDiv.textContent += '\n\nDebug Info:\n' + JSON.stringify(data.debug, null, 2);
                        }
                    }
                } catch (e) {
                    responseDiv.textContent = 'Failed to parse response as JSON:\n' + text;
                }
            } catch (error) {
                console.error('Fetch error:', error);
                responseDiv.textContent = 'Fetch Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
