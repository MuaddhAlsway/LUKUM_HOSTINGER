<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events - LAKUM</title>
    <link rel="icon" href="../../assest/favicon.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="admin-style.css">
    <link rel="stylesheet" href="../assest/popup-notification.css">
    <link rel="stylesheet" href="../assest/confirmation-popup.css">
</head>

<body>
    <div class="admin-container">
        <aside class="sidebar">
            <div class="logo">
                <h3 style="font-size: 24px; font-weight: 300; letter-spacing: 2px; margin: 0;">LAKUM</h3>
            </div>
            <div class="sidebar-lang-toggle">
                <a href="?lang=ar" class="sidebar-lang-btn">
                    <i class="ri-global-line"></i>
                    <span>العربية</span>
                </a>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><i class="ri-dashboard-line"></i><span>Dashboard</span></a>
                <a href="hero-manager.html" class="nav-item">
                    <i class="ri-image-line"></i>
                    <span>Hero Manager</span>
                </a>
                <a href="site-settings.html" class="nav-item">
                    <i class="ri-global-line"></i>
                    <span>Site Settings</span>
                </a>
                <a href="events.html" class="nav-item active"><i class="ri-calendar-event-line"></i><span>Events</span></a>
                <a href="blogs.html" class="nav-item"><i class="ri-article-line"></i><span>Blogs</span></a>
                <a href="press.html" class="nav-item"><i class="ri-newspaper-line"></i><span>Press</span></a>
                <a href="pricing.html" class="nav-item"><i class="ri-price-tag-3-line"></i><span>Pricing</span></a>
                <a href="legal-pages.html" class="nav-item"><i class="ri-file-text-line"></i><span>Legal Pages</span></a>
                <a href="settings.html" class="nav-item"><i class="ri-settings-3-line"></i><span>Settings</span></a>
            </nav>
            <div class="sidebar-footer">
                <a href="login.html" class="logout-btn"><i class="ri-logout-box-line"></i><span>Logout</span></a>
            </div>
        </aside>

        <main class="main-content">
            <a href="https://lakumartspace.com" target="_blank" class="admin-floating-btn" title="View Website">
                <i class="ri-external-link-line"></i>
            </a>

            <header>
                <h1><i class="ri-calendar-event-line"></i> Events</h1>
                <div style="display: flex; gap: 10px;">
                    <a href="add-event.html" class="btn-primary"><i class="ri-add-line"></i> Add Event</a>
                    <button id="deleteAllBtn" class="btn-secondary" style="background: #dc3545; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer;">
                        <i class="ri-delete-bin-line"></i> Delete All
                    </button>
                </div>
            </header>

            <div class="list-container">
                <div class="list-controls">
                    <select id="filterStatus" class="filter-select">
                        <option value="">All Status</option>
                        <option value="upcoming">Upcoming</option>
                        <option value="past">Past</option>
                    </select>
                </div>

                <table class="data-table">
                    <thead>
                        <tr>
                            <th style="width: 40px; text-align: center;">Featured</th>
                            <th>Title</th>
                            <th>Date</th>
                            <th>Location</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="eventsTableBody">
                        <tr>
                            <td colspan="6" style="text-align: center; padding: 40px;">Loading events...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmationModal" class="confirmation-modal" style="display: none;">
        <div class="confirmation-modal-content">
            <h2 class="confirmation-modal-title">Delete Event</h2>
            <p class="confirmation-modal-message">Are you sure you want to delete this event? This action cannot be undone.</p>
            <div class="confirmation-modal-actions">
                <button class="confirmation-modal-btn confirmation-modal-btn-cancel" onclick="closeConfirmationModal()">Cancel</button>
                <button class="confirmation-modal-btn confirmation-modal-btn-confirm" id="confirmDeleteBtn">Delete</button>
            </div>
        </div>
    </div>

    <script src="../assest/popup-notification.js?v=5.0.0" defer></script>
    <script src="../assest/confirmation-popup.js?v=1.0.0" defer></script>
    <script>
        let eventToDelete = null;
        let allEvents = [];

        // -----------------------------
        // Toggle Featured
        // -----------------------------
        async function toggleFeatured(eventId) {
            try {
                const eventObj = allEvents.find(e => parseInt(e.id) === parseInt(eventId));
                if (!eventObj) return showPopup('Event not found', 'error');

                const newStatus = eventObj.is_featured == 1 ? 0 : 1;
                showPopup('Updating...', 'info');

                const response = await fetch('../api/update_event_featured.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: eventId, is_featured: newStatus })
                });

                // Check for non-200 status
                if (!response.ok) {
                    const text = await response.text();
                    return showPopup('API Error: ' + text, 'error');
                }

                const result = await response.json();

                if (result.success) {
                    eventObj.is_featured = newStatus;
                    if (newStatus === 1) {
                        allEvents.forEach(e => { if (parseInt(e.id) !== parseInt(eventId)) e.is_featured = 0; });
                        showPopup('✓ Event marked as featured!', 'success');
                    } else {
                        showPopup('✓ Event unmarked as featured', 'success');
                    }
                    displayEvents(allEvents);
                } else {
                    showPopup('Error: ' + (result.error || result.message), 'error');
                }
            } catch (err) {
                console.error(err);
                showPopup('Error: ' + err.message, 'error');
            }
        }

        // -----------------------------
        // Load Events
        // -----------------------------
        async function loadEvents() {
            try {
                const response = await fetch('../api/get_events_real.php');
                if (!response.ok) throw new Error('Failed to fetch events');
                const data = await response.json();
                allEvents = data.data || [];
                filterAndDisplayEvents();
            } catch (err) {
                console.error(err);
                showPopup('Cannot load events. ' + err.message, 'error');
                displayEvents([]);
            }
        }

        // -----------------------------
        // Display Events
        // -----------------------------
        function displayEvents(events) {
            const tbody = document.getElementById('eventsTableBody');
            if (!events.length) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:40px;">No events found</td></tr>';
                return;
            }

            tbody.innerHTML = events.map(event => {
                const isFeatured = event.is_featured == 1;
                console.log('Rendering event:', event.id, event.title, 'Full event:', event);
                return `
                <tr>
                    <td style="text-align:center;">
                        <button onclick="toggleFeatured(${event.id})" style="font-size:24px; color:${isFeatured ? '#FFD700' : '#ccc'}; background:none; border:none; cursor:pointer;">
                            <i class="${isFeatured ? 'ri-star-fill' : 'ri-star-line'}"></i>
                        </button>
                    </td>
                    <td>${event.title}</td>
                    <td>${new Date(event.event_date).toLocaleDateString()}</td>
                    <td>${event.location || '-'}</td>
                    <td><span class="badge ${new Date(event.event_date) > new Date() ? 'upcoming' : 'past'}">${new Date(event.event_date) > new Date() ? 'Upcoming' : 'Past'}</span></td>
                    <td>
                        <a href="edit-event.html?id=${event.id}" class="btn-small" style="background-color:#28a745;color:white;">Edit</a>
                        <button type="button" onclick="openConfirmationModal(${event.id})" class="btn-small btn-danger" style="background-color:#dc3545;color:white;">Delete</button>
                    </td>
                </tr>`;
            }).join('');
        }

        // -----------------------------
        // Filter Events
        // -----------------------------
        function filterAndDisplayEvents() {
            const filter = document.getElementById('filterStatus').value;
            let filtered = allEvents;
            if (filter === 'upcoming') filtered = allEvents.filter(e => new Date(e.event_date) > new Date());
            else if (filter === 'past') filtered = allEvents.filter(e => new Date(e.event_date) <= new Date());
            displayEvents(filtered);
        }

        document.getElementById('filterStatus').addEventListener('change', filterAndDisplayEvents);

        // -----------------------------
        // Delete Event Modal
        // -----------------------------
        function openConfirmationModal(id) {
            console.log('Opening delete confirmation for event ID:', id);
            eventToDelete = parseInt(id);
            
            showDeleteEventConfirmation(async () => {
                const idToDelete = parseInt(eventToDelete);
                
                if (!idToDelete || idToDelete <= 0) {
                    showPopup('Error: No event selected or invalid ID', 'error');
                    return;
                }
                
                try {
                    const deletePayload = { id: idToDelete };
                    const jsonBody = JSON.stringify(deletePayload);
                    
                    console.log('Sending delete request with payload:', jsonBody);
                    
                    const response = await fetch('../api/delete_event.php', {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: jsonBody
                    });
                    
                    console.log('Response status:', response.status);
                    const responseText = await response.text();
                    console.log('Response text:', responseText);
                    
                    const data = JSON.parse(responseText);
                    console.log('Delete response:', data);
                    
                    if (data.success) {
                        showPopup('Event deleted successfully', 'success');
                        loadEvents();
                    } else {
                        showPopup('Error: ' + (data.message || 'Unknown'), 'error');
                    }
                } catch (err) {
                    console.error('Delete error:', err);
                    showPopup('Error deleting event', 'error');
                }
                
                eventToDelete = null;
            });
        }

        function closeConfirmationModal() {
            eventToDelete = null;
            document.getElementById('confirmationModal').classList.remove('active');
        }

        // -----------------------------
        // Delete All Events
        // -----------------------------
        document.getElementById('deleteAllBtn').addEventListener('click', async () => {
            showDeleteAllEventsConfirmation(async () => {
                try {
                    const response = await fetch('../api/delete_all_events.php', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
                    const data = await response.json();
                    if (data.success) showPopup('All events deleted successfully', 'success');
                    else showPopup('Error: ' + (data.message || 'Unknown'), 'error');
                    loadEvents();
                } catch (err) {
                    console.error(err);
                    showPopup('Error deleting all events', 'error');
                }
            });
        });

        // Load events on page load
        window.addEventListener('load', loadEvents);

        // Close modal when clicking outside
        document.getElementById('confirmationModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('confirmationModal')) closeConfirmationModal();
        });
    </script>
</body>
</html>
