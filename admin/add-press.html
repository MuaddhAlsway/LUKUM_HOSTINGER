<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Press - LAKUM</title>
    <link rel="icon" href="../../assest/favicon.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="admin-style.css">
    <link rel="stylesheet" href="event-form-style.css">
    <link rel="stylesheet" href="../assest/popup-notification.css">
    <style>
        #press-editor {
            width: 100%;
            min-height: 400px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            resize: vertical;
        }
    </style>
</head>

<body>
    <div class="admin-container">
        <aside class="sidebar">
            <div class="logo">
                <h3 style="font-size: 24px; font-weight: 300; letter-spacing: 2px; margin: 0;">LAKUM</h3>
            </div>

            <div class="sidebar-lang-toggle">
                <a href="?lang=ar" class="sidebar-lang-btn">
                    <i class="ri-global-line"></i>
                    <span>العربية</span>
                </a>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="ri-dashboard-line"></i>
                    <span>Dashboard</span>
                </a>
                <a href="events.html" class="nav-item">
                    <i class="ri-calendar-event-line"></i>
                    <span>Events</span>
                </a>
                <a href="blogs.html" class="nav-item">
                    <i class="ri-article-line"></i>
                    <span>Blogs</span>
                </a>
                <a href="press.html" class="nav-item active">
                    <i class="ri-newspaper-line"></i>
                    <span>Press</span>
                </a>
                <a href="pricing.html" class="nav-item">
                    <i class="ri-price-tag-3-line"></i>
                    <span>Pricing</span>
                </a>
                <a href="legal-pages.html" class="nav-item">
                    <i class="ri-file-text-line"></i>
                    <span>Legal Pages</span>
                </a>
                <a href="settings.html" class="nav-item">
                    <i class="ri-settings-3-line"></i>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="login.html" class="logout-btn">
                    <i class="ri-logout-box-line"></i>
                    <span>Logout</span>
                </a>
            </div>
        </aside>

        <main class="main-content">
            <a href="../../index.html" target="_blank" class="admin-floating-btn" title="View Website">
                <i class="ri-external-link-line"></i>
            </a>

            <header>
                <h1><i class="ri-add-circle-line"></i> Add New Press</h1>
                <a href="press.html" class="btn-secondary"><i class="ri-arrow-left-line"></i> Back</a>
            </header>

            <div class="modern-form-container">
                <form method="POST" enctype="multipart/form-data" id="pressForm">
                    <!-- Cover Image Section -->
                    <div class="cover-upload-section">
                        <div class="cover-preview" id="coverPreview">
                            <div class="cover-placeholder">
                                <i class="ri-image-add-line"></i>
                                <p>Click to upload cover image</p>
                                <span>Recommended: 1200x800px</span>
                            </div>
                            <img id="coverImg" style="display: none;">
                            <button type="button" class="remove-cover" id="removeCover" style="display: none;">
                                <i class="ri-close-line"></i>
                            </button>
                        </div>
                        <input type="file" id="cover_image" name="cover_image" accept="image/*,.jpg,.jpeg,.png,.gif,.webp,.heic,.heif" style="display: none;" required>
                    </div>

                    <!-- Press Details -->
                    <div class="form-section">
                        <h3><i class="ri-information-line"></i> Press Details</h3>

                        <!-- English Section -->
                        <div style="background: #f9f9f9; padding: 20px; border-radius: 8px; margin-bottom: 30px; border-left: 4px solid #000;">
                            <h4 style="margin: 0 0 16px 0; font-size: 1rem; font-weight: 600;">English</h4>
                            
                            <div class="form-group">
                                <label for="title_en">Press Title (EN) *</label>
                                <input type="text" id="title_en" name="title_en" placeholder="Enter press title in English" required>
                            </div>

                            <div class="form-group">
                                <label for="excerpt_en">Excerpt (EN)</label>
                                <textarea id="excerpt_en" name="excerpt_en" rows="3" placeholder="Brief summary in English..."></textarea>
                            </div>
                        </div>

                        <!-- Arabic Section -->
                        <div style="background: #f9f9f9; padding: 20px; border-radius: 8px; margin-bottom: 30px; border-left: 4px solid #999;">
                            <h4 style="margin: 0 0 16px 0; font-size: 1rem; font-weight: 600;">العربية</h4>
                            
                            <div class="form-group">
                                <label for="title_ar">Press Title (AR) *</label>
                                <input type="text" id="title_ar" name="title_ar" placeholder="أدخل عنوان الخبر بالعربية" required>
                            </div>

                            <div class="form-group">
                                <label for="excerpt_ar">Excerpt (AR)</label>
                                <textarea id="excerpt_ar" name="excerpt_ar" rows="3" placeholder="ملخص موجز بالعربية..." dir="rtl"></textarea>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="source">Source/Publication</label>
                            <input type="text" id="source" name="source" placeholder="e.g., Arab News, Al Jazeera">
                        </div>

                        <div class="form-group">
                            <label for="press_date">Publish Date</label>
                            <input type="date" id="press_date" name="press_date">
                        </div>

                        <div class="form-group">
                            <label for="url">External Link</label>
                            <input type="url" id="url" name="url" placeholder="https://example.com/article">
                        </div>
                    </div>

                    <!-- Form Actions -->
                    <div class="form-actions-modern">
                        <button type="submit" class="btn-primary-modern" id="submitBtn">
                            <i class="ri-check-line"></i> Create
                        </button>
                        <a href="press.html" class="btn-secondary-modern">
                            <i class="ri-close-line"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        // Cover Image Upload
        const coverPreview = document.getElementById('coverPreview');
        const coverInput = document.getElementById('cover_image');
        const coverImg = document.getElementById('coverImg');
        const removeCoverBtn = document.getElementById('removeCover');

        if (coverPreview && coverInput) {
            coverPreview.addEventListener('click', () => {
                coverInput.click();
            });

            coverInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        coverImg.src = e.target.result;
                        coverImg.style.display = 'block';
                        if (removeCoverBtn) {
                            removeCoverBtn.style.display = 'flex';
                        }
                        const placeholder = coverPreview.querySelector('.cover-placeholder');
                        if (placeholder) {
                            placeholder.style.display = 'none';
                        }
                    };
                    reader.readAsDataURL(file);
                }
            });

            if (removeCoverBtn) {
                removeCoverBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    coverInput.value = '';
                    coverImg.style.display = 'none';
                    coverImg.src = '';
                    removeCoverBtn.style.display = 'none';
                    const placeholder = coverPreview.querySelector('.cover-placeholder');
                    if (placeholder) {
                        placeholder.style.display = 'flex';
                    }
                });
            }
        }

        // Handle form submission
        document.getElementById('pressForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Validate required fields
            const title_en = document.getElementById('title_en').value.trim();
            const title_ar = document.getElementById('title_ar').value.trim();
            
            if (!title_en) {
                showPopup('Press title (English) is required', 'error');
                return;
            }
            if (!title_ar) {
                showPopup('Press title (Arabic) is required', 'error');
                return;
            }

            // Handle cover image upload
            if (coverInput.files.length === 0) {
                showPopup('Please select a cover image', 'error');
                return;
            }

            const file = coverInput.files[0];
            const uploadFormData = new FormData();
            uploadFormData.append('file', file);
            
            try {
                const uploadResponse = await fetch(getApiUrl('upload_cover_image.php'), {
                    method: 'POST',
                    body: uploadFormData
                });
                
                const uploadResult = await uploadResponse.json();
                
                if (!uploadResult.success) {
                    showPopup('Image upload failed: ' + uploadResult.message, 'error');
                    return;
                }

                const newPress = {
                    title_en: title_en,
                    title_ar: title_ar,
                    excerpt_en: document.getElementById('excerpt_en').value.trim(),
                    excerpt_ar: document.getElementById('excerpt_ar').value.trim(),
                    source: document.getElementById('source').value.trim(),
                    press_date: document.getElementById('press_date').value,
                    url: document.getElementById('url').value.trim(),
                    cover_image: uploadResult.path
                };

                const response = await fetch(getApiUrl('add_press.php'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(newPress)
                });

                const result = await response.json();
                
                if (result.success) {
                    showPopup('Press created successfully!', 'success');
                    setTimeout(() => {
                        window.location.href = 'press.html';
                    }, 1500);
                } else {
                    showPopup('Error: ' + (result.message || 'Failed to create press'), 'error');
                }
            } catch (error) {
                console.error('Error creating press:', error);
                showPopup('Error: ' + error.message, 'error');
            }
        });
    </script>
    <script src="config.js"></script>
    <script src="form-reset.js"></script>
    <script src="../assest/popup-notification.js?v=5.0.0" defer></script>
