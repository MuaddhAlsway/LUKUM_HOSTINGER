<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Settings - LAKUM</title>
    <link rel="icon" href="../assest/favicon.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="admin-style.css">
    <style>
        /* ── Tabs ── */
        .page-tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:28px; }
        .page-tab {
            padding:8px 20px; border:1px solid var(--border-color);
            background:var(--card-bg); border-radius:4px; cursor:pointer;
            font-size:13px; color:var(--text-secondary); transition:all .2s;
        }
        .page-tab:hover { background:#f0f0e8; }
        .page-tab.active { background:var(--text-primary); color:#fff; border-color:var(--text-primary); }

        /* ── Editor panels ── */
        .page-editor { display:none; }
        .page-editor.active { display:block; }

        /* ── Hero preview ── */
        .hero-preview {
            position:relative; width:100%; aspect-ratio:16/5;
            border-radius:8px; overflow:hidden; margin-bottom:24px; background:#1a1a1a;
        }
        .hero-preview img { width:100%; height:100%; object-fit:cover; display:block; }
        .hero-preview__overlay { position:absolute; inset:0; background:rgba(0,0,0,.38); }
        .hero-preview__text {
            position:absolute; inset:0; display:flex; flex-direction:column;
            align-items:center; justify-content:center; color:#fff; text-align:center; padding:20px;
        }
        .hero-preview__text h2 { font-size:26px; font-weight:300; letter-spacing:2px; margin-bottom:6px; }
        .hero-preview__text p  { font-size:13px; opacity:.85; max-width:560px; }

        /* ── Upload zone ── */
        .upload-zone {
            border:2px dashed var(--border-color); border-radius:8px; padding:28px;
            text-align:center; cursor:pointer; transition:border-color .2s;
            margin-bottom:24px; background:#fafaf5;
        }
        .upload-zone:hover { border-color:var(--text-primary); }
        .upload-zone i { font-size:30px; color:var(--text-muted); margin-bottom:6px; display:block; }
        .upload-zone p { color:var(--text-muted); font-size:13px; margin:0; }
        .upload-zone input[type="file"] { display:none; }
        .upload-progress { display:none; align-items:center; gap:10px; padding:12px 16px; background:#f0f0e8; border-radius:4px; margin-bottom:16px; font-size:13px; }
        .upload-progress.show { display:flex; }

        /* ── Form ── */
        .section-label {
            font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:1px;
            color:var(--text-muted); margin-bottom:12px; padding-bottom:8px;
            border-bottom:1px solid var(--border-color);
        }
        .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px; }
        .form-group label { display:block; font-size:12px; font-weight:500; color:var(--text-secondary); margin-bottom:6px; text-transform:uppercase; letter-spacing:.5px; }
        .form-group input, .form-group textarea {
            width:100%; padding:10px 14px; border:1px solid var(--border-color);
            border-radius:4px; font-size:14px; background:#fff; color:var(--text-primary); font-family:inherit;
        }
        .form-group textarea { resize:vertical; min-height:72px; }
        .form-group input:focus, .form-group textarea:focus { outline:none; border-color:var(--text-primary); }
        .form-group.full { grid-column:1/-1; }

        /* ── Buttons ── */
        .btn-save {
            background:var(--text-primary); color:#fff; border:none;
            padding:12px 32px; border-radius:4px; font-size:14px; cursor:pointer;
            display:inline-flex; align-items:center; gap:8px; transition:opacity .2s;
        }
        .btn-save:hover { opacity:.85; }

        /* ── Toast ── */
        .toast {
            position:fixed; bottom:24px; right:24px; padding:12px 20px;
            border-radius:4px; font-size:14px; color:#fff; z-index:9999;
            opacity:0; transform:translateY(10px); transition:all .3s; pointer-events:none;
        }
        .toast.show { opacity:1; transform:translateY(0); }
        .toast.success { background:var(--accent-green); }
        .toast.error   { background:var(--accent-red); }

        /* ── Info note ── */
        .info-note {
            background:#f0f0e8; border-left:3px solid var(--text-muted);
            padding:12px 16px; border-radius:4px; font-size:13px;
            color:var(--text-secondary); margin-bottom:24px;
        }
    </style>
</head>
<body>
<div class="admin-container">

    <!-- ── Sidebar ── -->
    <aside class="sidebar">
        <div class="logo">
            <h3 style="font-size:24px;font-weight:300;letter-spacing:2px;margin:0;">LAKUM</h3>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html"    class="nav-item"><i class="ri-dashboard-line"></i><span>Dashboard</span></a>
            <a href="hero-manager.html" class="nav-item"><i class="ri-image-line"></i><span>Hero Manager</span></a>
            <a href="site-settings.html" class="nav-item active"><i class="ri-global-line"></i><span>Site Settings</span></a>
            <a href="events.html"       class="nav-item"><i class="ri-calendar-event-line"></i><span>Events</span></a>
            <a href="blogs.html"        class="nav-item"><i class="ri-article-line"></i><span>Blogs</span></a>
            <a href="press.html"        class="nav-item"><i class="ri-newspaper-line"></i><span>Press</span></a>
            <a href="pricing.html"      class="nav-item"><i class="ri-price-tag-3-line"></i><span>Pricing</span></a>
            <a href="legal-pages.html"  class="nav-item"><i class="ri-file-text-line"></i><span>Legal Pages</span></a>
            <a href="settings.html"     class="nav-item"><i class="ri-settings-3-line"></i><span>Settings</span></a>
        </nav>
        <div class="sidebar-footer">
            <a href="login.html" class="logout-btn"><i class="ri-logout-box-line"></i><span>Logout</span></a>
        </div>
    </aside>

    <!-- ── Main ── -->
    <main class="main-content">
        <header>
            <h1><i class="ri-global-line"></i> Site Settings</h1>
            <p style="color:var(--text-muted);font-size:14px;margin-top:4px;">Customize content for every page — hero image, titles, and text</p>
        </header>

        <!-- Page tabs -->
        <div class="page-tabs" id="pageTabs">
            <button class="page-tab active" data-page="home">Home</button>
            <button class="page-tab" data-page="blog">Blog</button>
            <button class="page-tab" data-page="spaces">Spaces</button>
            <button class="page-tab" data-page="exhibitions">Exhibitions</button>
            <button class="page-tab" data-page="contact">Contact</button>
            <button class="page-tab" data-page="shop">Shop</button>
        </div>

        <div id="editors"></div>
    </main>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Page config ──────────────────────────────────────────────────────────────
const pages = [
    { key:'home',        label:'Home',        hasSubtitle:true,  hasTags:false },
    { key:'blog',        label:'Blog',        hasSubtitle:true,  hasTags:false },
    { key:'spaces',      label:'Spaces',      hasSubtitle:false, hasTags:true  },
    { key:'exhibitions', label:'Exhibitions', hasSubtitle:false, hasTags:false, imageOnly:true },
    { key:'contact',     label:'Contact',     hasSubtitle:true,  hasTags:false },
    { key:'shop',        label:'Shop',        hasSubtitle:false, hasTags:false },
];

let settings = {};

// ── Helpers ──────────────────────────────────────────────────────────────────
function get(page, field) {
    return settings[page]?.[field] ?? '';
}

function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Build all editors ────────────────────────────────────────────────────────
function buildEditors() {
    document.getElementById('editors').innerHTML = pages.map((p, i) => {
        const active = i === 0 ? 'active' : '';
        const img    = get(p.key, 'hero_image') || 'heroImage/img-4.webp';
        const title  = esc(get(p.key, 'title_en'));
        const sub    = esc(get(p.key, 'subtitle_en'));

        return `
        <div class="page-editor card ${active}" id="editor-${p.key}">

            <!-- Preview -->
            <div class="section-label">Hero Preview</div>
            <div class="hero-preview">
                <img id="prev-img-${p.key}" src="../${img}" alt="Hero">
                <div class="hero-preview__overlay"></div>
                <div class="hero-preview__text">
                    <h2 id="prev-title-${p.key}">${title || p.label}</h2>
                    <p  id="prev-sub-${p.key}">${sub}</p>
                </div>
            </div>

            <!-- Image upload -->
            <div class="section-label">Hero Image</div>
            <div class="upload-zone" onclick="document.getElementById('file-${p.key}').click()">
                <i class="ri-upload-cloud-2-line"></i>
                <p>Click to upload a new hero image</p>
                <p style="margin-top:4px;font-size:11px;">JPG, PNG, WebP — max 10MB</p>
                <input type="file" id="file-${p.key}" accept="image/*" onchange="uploadImage('${p.key}',this)">
            </div>
            <div class="upload-progress" id="prog-${p.key}">
                <i class="ri-loader-4-line"></i> Uploading...
            </div>

            ${p.imageOnly ? `
            <div class="info-note"><i class="ri-information-line"></i> This page uses a full-width image hero with no text overlay.</div>
            ` : `
            <!-- Text content -->
            <div class="section-label">Text Content</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Title (English)</label>
                    <input type="text" id="title_en-${p.key}"
                        value="${esc(get(p.key,'title_en'))}"
                        oninput="livePreview('${p.key}')"
                        placeholder="Page title in English">
                </div>
                <div class="form-group">
                    <label>Title (Arabic)</label>
                    <input type="text" id="title_ar-${p.key}"
                        value="${esc(get(p.key,'title_ar'))}"
                        dir="rtl" placeholder="العنوان بالعربية">
                </div>
                ${p.hasSubtitle ? `
                <div class="form-group">
                    <label>Subtitle (English)</label>
                    <textarea id="subtitle_en-${p.key}"
                        oninput="livePreview('${p.key}')"
                        placeholder="Short description...">${esc(get(p.key,'subtitle_en'))}</textarea>
                </div>
                <div class="form-group">
                    <label>Subtitle (Arabic)</label>
                    <textarea id="subtitle_ar-${p.key}" dir="rtl"
                        placeholder="وصف قصير...">${esc(get(p.key,'subtitle_ar'))}</textarea>
                </div>` : ''}
                ${p.hasTags ? `
                <div class="form-group">
                    <label>Tags (English) <span style="font-weight:300;text-transform:none;letter-spacing:0">— comma separated</span></label>
                    <input type="text" id="tags_en-${p.key}"
                        value="${esc(get(p.key,'tags_en'))}"
                        oninput="livePreview('${p.key}')"
                        placeholder="Art, Gallery, Hub, Library, Shop, Café">
                </div>
                <div class="form-group">
                    <label>Tags (Arabic) <span style="font-weight:300;text-transform:none;letter-spacing:0">— comma separated</span></label>
                    <input type="text" id="tags_ar-${p.key}"
                        value="${esc(get(p.key,'tags_ar'))}"
                        dir="rtl" placeholder="فن, معرض, مركز, مكتبة, متجر, مقهى">
                </div>` : ''}
            </div>
            <button class="btn-save" onclick="saveText('${p.key}')">
                <i class="ri-save-line"></i> Save Changes
            </button>`}
        </div>`;
    }).join('');

    // Tab listeners
    document.querySelectorAll('.page-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.page-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.page-editor').forEach(e => e.classList.remove('active'));
            tab.classList.add('active');
            document.getElementById('editor-' + tab.dataset.page)?.classList.add('active');
        });
    });
}

// ── Live preview ─────────────────────────────────────────────────────────────
function livePreview(page) {
    const titleEl = document.getElementById(`prev-title-${page}`);
    const subEl   = document.getElementById(`prev-sub-${page}`);
    const title   = document.getElementById(`title_en-${page}`)?.value;
    const sub     = document.getElementById(`subtitle_en-${page}`)?.value;
    const tags    = document.getElementById(`tags_en-${page}`)?.value;
    if (titleEl && title !== undefined) titleEl.textContent = title;
    if (subEl) {
        if (sub  !== undefined) subEl.textContent = sub;
        if (tags !== undefined) subEl.textContent = tags;
    }
}

// ── Upload image ─────────────────────────────────────────────────────────────
async function uploadImage(page, input) {
    if (!input.files[0]) return;
    const prog = document.getElementById(`prog-${page}`);
    prog.classList.add('show');

    const fd = new FormData();
    fd.append('hero_image', input.files[0]);
    fd.append('page', page);

    try {
        const res  = await fetch('../api/save_site_settings.php', { method:'POST', body:fd });
        const data = await res.json();
        if (data.success) {
            document.getElementById(`prev-img-${page}`).src = '../' + data.image + '?t=' + Date.now();
            if (!settings[page]) settings[page] = {};
            settings[page].hero_image = data.image;
            toast('Image uploaded', 'success');
        } else {
            toast(data.message || 'Upload failed', 'error');
        }
    } catch { toast('Upload failed', 'error'); }
    finally  { prog.classList.remove('show'); input.value = ''; }
}

// ── Save text ────────────────────────────────────────────────────────────────
async function saveText(page) {
    const payload = { page };
    const fields = ['title_en','title_ar','subtitle_en','subtitle_ar','tags_en','tags_ar'];
    fields.forEach(f => {
        const el = document.getElementById(`${f}-${page}`);
        if (el) payload[f] = el.value;
    });

    try {
        const res  = await fetch('../api/save_site_settings.php', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify(payload)
        });
        const data = await res.json();
        toast(data.success ? 'Saved successfully' : (data.message || 'Save failed'), data.success ? 'success' : 'error');
        if (data.success && !settings[page]) settings[page] = {};
        if (data.success) Object.assign(settings[page] || (settings[page]={}), payload);
    } catch { toast('Save failed','error'); }
}

// ── Toast ────────────────────────────────────────────────────────────────────
function toast(msg, type='success') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `toast ${type} show`;
    setTimeout(() => el.classList.remove('show'), 3000);
}

// ── Init ─────────────────────────────────────────────────────────────────────
async function init() {
    try {
        const res  = await fetch('../api/get_site_settings.php');
        const data = await res.json();
        if (data.success) settings = data.data;
    } catch { /* use defaults */ }
    buildEditors();
}

init();
</script>
</body>
</html>
