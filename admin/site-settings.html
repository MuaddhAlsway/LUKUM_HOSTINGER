        .page-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
        .page-tab{padding:8px 20px;border:1px solid var(--border-color);background:var(--card-bg);border-radius:4px;cursor:pointer;font-size:13px;color:var(--text-secondary);transition:all .2s}
        .page-tab:hover{background:#f0f0e8}
        .page-tab.active{background:var(--text-primary);color:#fff;border-color:var(--text-primary)}
        .page-editor{display:none}
        .page-editor.active{display:block}
        .section-block{background:#fff;border:1px solid var(--border-color);border-radius:8px;padding:24px;margin-bottom:20px}
        .section-block__title{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border-color);display:flex;align-items:center;gap:8px}
        .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
        .form-grid.single{grid-template-columns:1fr}
        .form-group label{display:block;font-size:11px;font-weight:600;color:var(--text-secondary);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
        .form-group input,.form-group textarea,.form-group select{width:100%;padding:9px 12px;border:1px solid var(--border-color);border-radius:4px;font-size:13px;background:#fff;color:var(--text-primary);font-family:inherit}
        .form-group textarea{resize:vertical;min-height:80px}
        .form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;border-color:var(--text-primary)}
        .form-group.full{grid-column:1/-1}
        .img-upload-row{display:flex;align-items:center;gap:16px;padding:12px;background:#fafaf5;border:1px dashed var(--border-color);border-radius:6px;cursor:pointer;transition:border-color .2s}
        .img-upload-row:hover{border-color:var(--text-primary)}
        .img-upload-row img{width:80px;height:56px;object-fit:cover;border-radius:4px;border:1px solid var(--border-color)}
        .img-upload-row .upload-info{flex:1}
        .img-upload-row .upload-info p{font-size:13px;color:var(--text-secondary);margin:0}
        .img-upload-row .upload-info small{font-size:11px;color:var(--text-muted)}
        .img-upload-row input[type=file]{display:none}
        .btn-save{background:var(--text-primary);color:#fff;border:none;padding:11px 28px;border-radius:4px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:opacity .2s;margin-top:4px}
        .btn-save:hover{opacity:.85}
        .toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:4px;font-size:14px;color:#fff;z-index:9999;opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none}
        .toast.show{opacity:1;transform:translateY(0)}
        .toast.success{background:var(--accent-green)}
        .toast.error{background:var(--accent-red)}
        .uploading-badge{display:none;font-size:11px;color:var(--text-muted);margin-left:8px}
        .uploading-badge.show{display:inline}
    </style>

let saved = {};

function g(page, key) {
  return saved[page]?.[key] ?? DEFAULTS[page]?.[key] ?? '';
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── Image upload widget ───────────────────────────────────────────────────────
function imgWidget(page, key, label) {
  const src = g(page, key);
  const id = `img-${page}-${key}`;
  return `
  <div class="form-group full">
    <label>${label}</label>
    <div class="img-upload-row" onclick="document.getElementById('${id}').click()">
      <img id="prev-${page}-${key}" src="../${esc(src)}" alt="${label}" onerror="this.src='../heroImage/img-4.webp'">
      <div class="upload-info">
        <p>Click to upload a new image</p>
        <small>JPG, PNG, WebP — max 10MB</small>
        <span class="uploading-badge" id="badge-${page}-${key}">Uploading...</span>
      </div>
      <input type="file" id="${id}" accept="image/*" onchange="uploadImg('${page}','${key}',this)">
    </div>
  </div>`;
}

// ── Text field helpers ────────────────────────────────────────────────────────
function field(page, key, label, type='input', dir='ltr') {
  const val = esc(g(page, key));
  if (type === 'textarea') return `<div class="form-group"><label>${label}</label><textarea id="f-${page}-${key}" dir="${dir}">${val}</textarea></div>`;
  return `<div class="form-group"><label>${label}</label><input type="text" id="f-${page}-${key}" value="${val}" dir="${dir}"></div>`;
}
function fieldFull(page, key, label, type='input', dir='ltr') {
  const val = esc(g(page, key));
  if (type === 'textarea') return `<div class="form-group full"><label>${label}</label><textarea id="f-${page}-${key}" dir="${dir}">${val}</textarea></div>`;
  return `<div class="form-group full"><label>${label}</label><input type="text" id="f-${page}-${key}" value="${val}" dir="${dir}"></div>`;
}
function block(icon, title, content, page, saveKey) {
  return `<div class="section-block"><div class="section-block__title"><i class="${icon}"></i>${title}</div><div class="form-grid">${content}</div><button class="btn-save" onclick="save('${page}','${saveKey}')"><i class="ri-save-line"></i> Save</button></div>`;
}

        field('contact','hours_weekday_en','Weekday Hours (EN)') + field('contact','hours_weekday_ar','Weekday Hours (AR)','input','rtl') +
        field('contact','hours_weekend_en','Weekend Hours (EN)') + field('contact','hours_weekend_ar','Weekend Hours (AR)','input','rtl'),
        'contact','info')}
      ${block('ri-share-line','Social Media Links',
        field('contact','instagram_url','Instagram URL') + field('contact','twitter_url','Twitter/X URL'),
        'contact','social')}
      ${block('ri-map-2-line','Google Maps Embed',
        fieldFull('contact','map_embed','Google Maps Embed URL (src from iframe)','textarea'),
        'contact','map')}
    </div>

    <!-- SHOP -->
    <div class="page-editor" id="editor-shop">
      ${block('ri-store-line','Hero Section',
        imgWidget('shop','hero_image','Hero Image') +
        field('shop','hero_title_en','Title (English)') + field('shop','hero_title_ar','Title (Arabic)','input','rtl') +
        fieldFull('shop','shop_link','Shop External URL'),
        'shop','hero')}
    </div>
  `;

  // Tab switching
  document.querySelectorAll('.page-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.page-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.page-editor').forEach(e => e.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('editor-' + tab.dataset.page)?.classList.add('active');
    });
  });
}

// ── Collect all fields for a page+section ────────────────────────────────────
function collectFields(page, sectionKey) {
  const payload = { page, section: sectionKey };
  // Collect all inputs/textareas whose id starts with f-{page}-
  document.querySelectorAll(`[id^="f-${page}-"]`).forEach(el => {
    const key = el.id.replace(`f-${page}-`, '');
    payload[key] = el.value;
  });
  return payload;
}

// ── Save text fields ──────────────────────────────────────────────────────────
async function save(page, sectionKey) {
  const payload = collectFields(page, sectionKey);
  try {
    const res  = await fetch('../api/save_site_settings.php', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)
    });
    const data = await res.json();
    toast(data.success ? 'Saved' : (data.message||'Error'), data.success ? 'success' : 'error');
    if (data.success) { if (!saved[page]) saved[page]={}; Object.assign(saved[page], payload); }
  } catch { toast('Save failed','error'); }
}

// ── Upload image ──────────────────────────────────────────────────────────────
async function uploadImg(page, key, input) {
  if (!input.files[0]) return;
  const badge = document.getElementById(`badge-${page}-${key}`);
  if (badge) badge.classList.add('show');
  const fd = new FormData();
  fd.append('image', input.files[0]);
  fd.append('page', page);
  fd.append('key', key);
  try {
    const res  = await fetch('../api/save_site_settings.php', { method:'POST', body:fd });
    const data = await res.json();
    if (data.success) {
      const prev = document.getElementById(`prev-${page}-${key}`);
      if (prev) prev.src = '../' + data.image + '?t=' + Date.now();
      if (!saved[page]) saved[page]={};
      saved[page][key] = data.image;
      toast('Image uploaded','success');
    } else { toast(data.message||'Upload failed','error'); }
  } catch { toast('Upload failed','error'); }
  finally { if (badge) badge.classList.remove('show'); input.value=''; }
}

// ── Toast ─────────────────────────────────────────────────────────────────────
function toast(msg, type='success') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = `toast ${type} show`;
  setTimeout(() => el.classList.remove('show'), 3000);
}

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  try {
    const res  = await fetch('../api/get_site_settings.php');
    const data = await res.json();
    if (data.success) saved = data.data;
  } catch {}
  buildEditors();
}
init();
</script>
