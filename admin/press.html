        <main class="main-content">

    </div>

    <style>
        /* Confirmation Modal Styles */
        .confirmation-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        .confirmation-modal.active {
            display: flex;
        }

        .confirmation-modal-content {
            background: white;
            border-radius: 8px;
            padding: 32px;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.3s ease;
        }

        .confirmation-modal-title {
            font-size: 20px;
            font-weight: 600;
            color: #1a1a1a;
            margin: 0 0 12px 0;
        }

        .confirmation-modal-message {
            font-size: 14px;
            color: #666;
            margin: 0 0 24px 0;
            line-height: 1.5;
        }

        .confirmation-modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .confirmation-modal-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .confirmation-modal-btn-cancel {
            background: #f0f0f0;
            color: #333;
        }

        .confirmation-modal-btn-cancel:hover {
            background: #e0e0e0;
        }

        .confirmation-modal-btn-confirm {
            background: #dc3545;
            color: white;
        }

        .confirmation-modal-btn-confirm:hover {
            background: #c82333;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>

    <div id="confirmationModal" class="confirmation-modal">
        <div class="confirmation-modal-content">
            <h2 class="confirmation-modal-title">Delete Press</h2>
            <p class="confirmation-modal-message">Are you sure you want to delete this press? This action cannot be undone.</p>
            <div class="confirmation-modal-actions">
                <button class="confirmation-modal-btn confirmation-modal-btn-cancel" onclick="closeConfirmationModal()">Cancel</button>
                <button class="confirmation-modal-btn confirmation-modal-btn-confirm" onclick="confirmDeletePress()">Delete</button>
            </div>
        </div>
    </div>
    <script>
        let pressToDelete = null;

        async function loadPress() {
            try {
                console.log('Fetching press from: ../api/get_press.php');
                const response = await fetch('../api/get_press.php');
                console.log('Response status:', response.status);
                console.log('Response ok:', response.ok);
                
                const data = await response.json();
                console.log('API Response:', data);
                
                if (data.success && data.data) {
                    console.log('Press data loaded successfully, count:', data.data.length);
                    displayPress(data.data);
                } else {
                    console.error('API returned error:', data.message || 'Unknown error');
                    throw new Error(data.message || 'No data from API');
                }
            } catch (error) {
                console.error('Error loading press:', error);
                showPopup('ERROR: Cannot connect to database.\nMake sure XAMPP is running and you are using: http://localhost/\n(NOT Live Server)\n\nError: ' + error.message, 'error');
                displayPress([]);
            }
        }

        function displayPress(items) {
            const tbody = document.getElementById('pressTableBody');
            
            if (items.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 40px;">No press found</td></tr>';
                return;
            }

            tbody.innerHTML = items.map(item => `
                <tr>
                    <td>${item.title}</td>
                    <td>${new Date(item.created_at).toLocaleDateString()}</td>
                    <td><span class="badge active">Published</span></td>
                    <td>
                        <a href="edit-press.html?id=${item.id}" class="btn-small" style="background-color: #28a745; color: white;">Edit</a>
                        <button onclick="openConfirmationModal(${item.id})" class="btn-small btn-danger" style="background-color: #dc3545; color: white;">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function openConfirmationModal(id) {
            pressToDelete = id;
            document.getElementById('confirmationModal').classList.add('active');
        }

        function closeConfirmationModal() {
            pressToDelete = null;
            document.getElementById('confirmationModal').classList.remove('active');
        }

        function confirmDeletePress() {
            if (!pressToDelete) return;

            const id = pressToDelete;
            closeConfirmationModal();

            fetch(`../api/delete_press.php`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ id: id })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showPopup('Press deleted successfully', 'success');
                    loadPress();
                } else {
                    showPopup('Error deleting press: ' + (data.message || 'Unknown error'), 'error');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showPopup('Error deleting press', 'error');
            });
        }

        // Close modal when clicking outside
        document.getElementById('confirmationModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeConfirmationModal();
            }
        });

        window.addEventListener('load', loadPress);
    </script>
</body>

</html>
