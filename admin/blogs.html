<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogs - LAKUM</title>
    <link rel="icon" href="../../assest/favicon.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="admin-style.css">
    <link rel="stylesheet" href="../assest/popup-notification.css">
    <link rel="stylesheet" href="../assest/confirmation-popup.css">
</head>

<body>
    <div class="admin-container">
        <aside class="sidebar">
            <div class="logo">
                <h3 style="font-size: 24px; font-weight: 300; letter-spacing: 2px; margin: 0;">LAKUM</h3>
            </div>

            <div class="sidebar-lang-toggle">
                <a href="?lang=ar" class="sidebar-lang-btn">
                    <i class="ri-global-line"></i>
                    <span>العربية</span>
                </a>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="ri-dashboard-line"></i>
                    <span>Dashboard</span>
                </a>
                <a href="events.html" class="nav-item">
                    <i class="ri-calendar-event-line"></i>
                    <span>Events</span>
                </a>
                <a href="blogs.html" class="nav-item active">
                    <i class="ri-article-line"></i>
                    <span>Blogs</span>
                </a>
                <a href="press.html" class="nav-item">
                    <i class="ri-newspaper-line"></i>
                    <span>Press</span>
                </a>
                <a href="pricing.html" class="nav-item">
                    <i class="ri-price-tag-3-line"></i>
                    <span>Pricing</span>
                </a>
                <a href="legal-pages.html" class="nav-item">
                    <i class="ri-file-text-line"></i>
                    <span>Legal Pages</span>
                </a>
                <a href="settings.html" class="nav-item">
                    <i class="ri-settings-3-line"></i>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="login.html" class="logout-btn">
                    <i class="ri-logout-box-line"></i>
                    <span>Logout</span>
                </a>
            </div>
        </aside>

        <main class="main-content">
            <a href="../../index.html" target="_blank" class="admin-floating-btn" title="View Website">
                <i class="ri-external-link-line"></i>
            </a>

            <header>
                <h1><i class="ri-article-line"></i> Blogs</h1>
                <div style="display: flex; gap: 10px;">
                    <a href="add-blog.html" class="btn-primary"><i class="ri-add-line"></i> Add Blog</a>
                    <button onclick="deleteAllBlogs()" class="btn-secondary" style="background: #dc3545; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer;"><i class="ri-delete-bin-line"></i> Delete All</button>
                </div>
            </header>

            <div class="list-container">
                <div class="list-controls">
                </div>

                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="blogsTableBody">
                        <tr>
                            <td colspan="5" style="text-align: center; padding: 40px;">Loading blogs...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <style>
        /* Confirmation Modal Styles */
        .confirmation-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        .confirmation-modal.active {
            display: flex;
        }

        .confirmation-modal-content {
            background: white;
            border-radius: 8px;
            padding: 32px;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.3s ease;
        }

        .confirmation-modal-title {
            font-size: 20px;
            font-weight: 600;
            color: #1a1a1a;
            margin: 0 0 12px 0;
        }

        .confirmation-modal-message {
            font-size: 14px;
            color: #666;
            margin: 0 0 24px 0;
            line-height: 1.5;
        }

        .confirmation-modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .confirmation-modal-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .confirmation-modal-btn-cancel {
            background: #f0f0f0;
            color: #333;
        }

        .confirmation-modal-btn-cancel:hover {
            background: #e0e0e0;
        }

        .confirmation-modal-btn-confirm {
            background: #dc3545;
            color: white;
        }

        .confirmation-modal-btn-confirm:hover {
            background: #c82333;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>

    <div id="confirmationModal" class="confirmation-modal">
        <div class="confirmation-modal-content">
            <h2 class="confirmation-modal-title">Delete Blog</h2>
            <p class="confirmation-modal-message">Are you sure you want to delete this blog? This action cannot be undone.</p>
            <div class="confirmation-modal-actions">
                <button class="confirmation-modal-btn confirmation-modal-btn-cancel" onclick="closeConfirmationModal()">Cancel</button>
                <button class="confirmation-modal-btn confirmation-modal-btn-confirm" onclick="confirmDeleteBlog()">Delete</button>
            </div>
        </div>
    </div>

    <script>
        let allBlogs = [];
        let blogToDelete = null;

        async function loadBlogs() {
            try {
                const response = await fetch('../api/get_blogs.php');
                const data = await response.json();
                
                if (data.success && data.data) {
                    allBlogs = data.data;
                    displayBlogs(allBlogs);
                } else {
                    throw new Error('No data from API');
                }
            } catch (error) {
                console.error('Error loading blogs:', error);
                showPopup('ERROR: Cannot connect to database.\nMake sure XAMPP is running and you are using: http://localhost/\n(NOT Live Server)', 'error');
                displayBlogs([]);
            }
        }

        function displayBlogs(blogs) {
            const tbody = document.getElementById('blogsTableBody');
            
            if (blogs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 40px;">No blogs found</td></tr>';
                return;
            }

            tbody.innerHTML = blogs.map(blog => `
                <tr>
                    <td>
                        <strong>${blog.title}</strong>
                        <br><small style="color: #999;">${blog.category || 'Uncategorized'}</small>
                    </td>
                    <td>${blog.author || '-'}</td>
                    <td>${new Date(blog.created_at).toLocaleDateString()}</td>
                    <td><span class="badge active">Published</span></td>
                    <td>
                        <a href="edit-blog.html?id=${blog.id}" class="btn-small" style="background-color: #28a745; color: white;">Edit</a>
                        <button onclick="openConfirmationModal(${blog.id})" class="btn-small btn-danger" style="background-color: #dc3545; color: white;">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function openConfirmationModal(id) {
            blogToDelete = id;
            document.getElementById('confirmationModal').classList.add('active');
        }

        function closeConfirmationModal() {
            blogToDelete = null;
            document.getElementById('confirmationModal').classList.remove('active');
        }

        function confirmDeleteBlog() {
            if (!blogToDelete) return;

            const id = blogToDelete;
            closeConfirmationModal();

            fetch(`../api/delete_blog_simple.php`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ id: id })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showPopup('Blog deleted successfully', 'success');
                    loadBlogs();
                } else {
                    showPopup('Error deleting blog: ' + (data.message || 'Unknown error'), 'error');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showPopup('Error deleting blog', 'error');
            });
        }

        function deleteAllBlogs() {
            showDeleteAllBlogsConfirmation(() => {
                fetch(`../api/delete_all_blogs.php`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        showPopup('All blogs deleted successfully', 'success');
                        loadBlogs();
                    } else {
                        showPopup('Error deleting blogs: ' + (data.message || 'Unknown error'), 'error');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    showPopup('Error deleting blogs', 'error');
                });
            });
        }

        // Close modal when clicking outside
        document.getElementById('confirmationModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeConfirmationModal();
            }
        });

        window.addEventListener('load', loadBlogs);
    </script>
</body>

</html>
