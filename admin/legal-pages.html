    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const termsForm = document.getElementById('terms-form');
            const privacyForm = document.getElementById('privacy-form');
            
            const termsEditorEn = document.getElementById('terms-editor-en');
            const termsEditorAr = document.getElementById('terms-editor-ar');
            const termsTitleEn = document.getElementById('terms-title-en');
            const termsTitleAr = document.getElementById('terms-title-ar');
            
            const privacyEditorEn = document.getElementById('privacy-editor-en');
            const privacyEditorAr = document.getElementById('privacy-editor-ar');
            const privacyTitleEn = document.getElementById('privacy-title-en');
            const privacyTitleAr = document.getElementById('privacy-title-ar');

            // Load existing content
            loadLegalPageContent('terms', termsEditorEn, termsEditorAr, termsTitleEn, termsTitleAr);
            loadLegalPageContent('privacy', privacyEditorEn, privacyEditorAr, privacyTitleEn, privacyTitleAr);

            // Handle form submissions
            if (termsForm) {
                termsForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    saveLegalPageContent('terms', termsTitleEn.value, termsEditorEn.value, termsTitleAr.value, termsEditorAr.value);
                });
            }

            if (privacyForm) {
                privacyForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    saveLegalPageContent('privacy', privacyTitleEn.value, privacyEditorEn.value, privacyTitleAr.value, privacyEditorAr.value);
                });
            }
        });

        async function loadLegalPageContent(pageType, editorEnElement, editorArElement, titleEnElement, titleArElement) {
            try {
                // Load English content
                const enResponse = await fetch(`../api/get_legal_page.php?page_key=${pageType}&lang=en`);
                const enData = await enResponse.json();

                if (enData.success && enData.data) {
                    if (titleEnElement) titleEnElement.value = enData.data.title || '';
                    if (editorEnElement) editorEnElement.value = enData.data.content || '';
                    console.log(`Loaded ${pageType} English content from database`);
                }

                // Load Arabic content
                const arResponse = await fetch(`../api/get_legal_page.php?page_key=${pageType}&lang=ar`);
                const arData = await arResponse.json();

                if (arData.success && arData.data) {
                    if (titleArElement) titleArElement.value = arData.data.title || '';
                    if (editorArElement) editorArElement.value = arData.data.content || '';
                    console.log(`Loaded ${pageType} Arabic content from database`);
                }
            } catch (error) {
                console.error(`Error loading ${pageType} content:`, error);
            }
        }

        async function saveLegalPageContent(pageType, titleEn, contentEn, titleAr, contentAr) {
            try {
                // Validate English content is not empty
                if (!contentEn || contentEn.trim().length === 0) {
                    alert(`Error: ${pageType} English content is required.`);
                    return;
                }
                
                const payload = {
                    page_key: pageType,
                    title_en: titleEn || pageType.charAt(0).toUpperCase() + pageType.slice(1),
                    content_en: contentEn,
                    title_ar: titleAr || null,
                    content_ar: contentAr || null
                };
                
                console.log('Sending payload:', payload);
                
                const response = await fetch('../api/save_legal_page.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });

                const responseText = await response.text();
                console.log('Raw response:', responseText);
                
                const data = JSON.parse(responseText);

                if (data.success) {
                    alert(`${pageType.charAt(0).toUpperCase() + pageType.slice(1)} page saved successfully!`);
                    // Reload the content to show it was saved
                    if (pageType === 'terms') {
                        loadLegalPageContent('terms', 
                            document.getElementById('terms-editor-en'),
                            document.getElementById('terms-editor-ar'),
                            document.getElementById('terms-title-en'),
                            document.getElementById('terms-title-ar')
                        );
                    } else {
                        loadLegalPageContent('privacy',
                            document.getElementById('privacy-editor-en'),
                            document.getElementById('privacy-editor-ar'),
                            document.getElementById('privacy-title-en'),
                            document.getElementById('privacy-title-ar')
                        );
                    }
                } else {
                    alert(`Error saving ${pageType} page: ${data.message}`);
                }
            } catch (error) {
                console.error(`Error saving ${pageType} content:`, error);
                alert(`Error saving ${pageType} content: ${error.message}`);
            }
        }
    </script>
