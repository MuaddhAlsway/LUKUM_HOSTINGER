<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events Management - LAKUM Admin</title>
<link rel="icon" href="../assest/favicon.png" type="image/png">
<link rel="stylesheet" href="admin-style.css">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
<style>
.admin-container { display: flex; min-height: 100vh; }
.sidebar { width: 280px; background: #1a1a1a; color: white; padding: 0; position: fixed; height: 100vh; overflow-y: auto; }
.main-content { margin-left: 280px; flex: 1; padding: 40px; }
.events-table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.events-table th { background: #f6f6eb; padding: 15px; text-align: left; font-weight: 500; border-bottom: 1px solid #e0e0e0; }
.events-table td { padding: 15px; border-bottom: 1px solid #e0e0e0; }
.events-table tbody tr:hover { background: #f9f9f9; }
.action-buttons { display: flex; gap: 10px; }
.btn-edit, .btn-delete { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
.btn-edit { background: #2e7d32; color: white; }
.btn-delete { background: #c2185b; color: white; }
.btn-add { background: #1a1a1a; color: white; padding: 12px 24px; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 20px; }
.badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; }
.badge.upcoming { background: rgba(46,125,50,0.1); color: #2e7d32; }
.badge.past { background: rgba(194,24,91,0.1); color: #c2185b; }
</style>
</head>
<body>
<div class="admin-container">
<aside class="sidebar">
<div class="logo" style="padding: 30px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1);">
<h2 style="font-size: 18px; font-weight: 300;">LAKUM Admin</h2>
</div>
<nav style="padding: 20px;">
<a href="dashboard.html" style="display: block; padding: 12px 16px; color: rgba(255,255,255,0.7); text-decoration: none; margin-bottom: 8px; border-radius: 4px;"><i class="ri-dashboard-line"></i> Dashboard</a>
<a href="events-management.html" style="display: block; padding: 12px 16px; color: white; text-decoration: none; margin-bottom: 8px; border-radius: 4px; background: rgba(255,255,255,0.1);"><i class="ri-calendar-line"></i> Events</a>
<a href="blogs-management.html" style="display: block; padding: 12px 16px; color: rgba(255,255,255,0.7); text-decoration: none; margin-bottom: 8px; border-radius: 4px;"><i class="ri-article-line"></i> Blogs</a>
<a href="pricing-management.html" style="display: block; padding: 12px 16px; color: rgba(255,255,255,0.7); text-decoration: none; margin-bottom: 8px; border-radius: 4px;"><i class="ri-price-tag-line"></i> Pricing</a>
</nav>
</aside>

<main class="main-content">
<header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #e0e0e0;">
<h1 style="font-size: 28px; font-weight: 300;"><i class="ri-calendar-line"></i> Events Management</h1>
<a href="add-event.html" class="btn-add"><i class="ri-add-line"></i> Add Event</a>
</header>

<div id="alertContainer"></div>

<!-- Filter Buttons -->
<div style="display: flex; gap: 10px; margin-bottom: 20px;">
  <button onclick="eventManagement.filterEvents('all')" class="filter-btn active" data-filter="all" style="padding: 10px 20px; border: 2px solid #1a1a1a; background: #1a1a1a; color: white; border-radius: 4px; cursor: pointer; font-weight: 500;">All Events</button>
  <button onclick="eventManagement.filterEvents('upcoming')" class="filter-btn" data-filter="upcoming" style="padding: 10px 20px; border: 2px solid #1a1a1a; background: white; color: #1a1a1a; border-radius: 4px; cursor: pointer; font-weight: 500;">Upcoming</button>
  <button onclick="eventManagement.filterEvents('past')" class="filter-btn" data-filter="past" style="padding: 10px 20px; border: 2px solid #1a1a1a; background: white; color: #1a1a1a; border-radius: 4px; cursor: pointer; font-weight: 500;">Previous</button>
</div>

<table class="events-table">
<thead>
<tr>
<th>Title</th>
<th>Date</th>
<th>Location</th>
<th>Category</th>
<th>Status</th>
<th>Featured</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="eventsTableBody">
<tr><td colspan="7" style="text-align: center; padding: 40px;">Loading...</td></tr>
</tbody>
</table>

<!-- Event Details Modal -->
<div id="eventModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
  <div style="background: white; border-radius: 8px; padding: 40px; max-width: 700px; width: 90%; max-height: 80vh; overflow-y: auto; position: relative;">
    <button onclick="eventManagement.closeModal()" style="position: absolute; top: 20px; right: 20px; background: none; border: none; font-size: 24px; cursor: pointer;">×</button>
    <div id="eventModalContent"></div>
  </div>
</div>
</main>
</div>

<script>
class EventsManagement {
  constructor() {
    this.events = [];
    this.filteredEvents = [];
    this.currentFilter = 'all';
    this.init();
  }

  async init() {
    await this.loadEvents();
    this.setupEventListeners();
  }

  async loadEvents() {
    try {
      const response = await fetch('../api/get_events.php?type=all');
      const data = await response.json();
      
      if (data.success) {
        this.events = data.data;
      } else {
        this.loadMockData();
      }
    } catch (error) {
      this.loadMockData();
    }
    
    this.render();
  }

  loadMockData() {
    fetch('../data/mock-data.json')
      .then(r => r.json())
      .then(data => {
        this.events = data.events;
        this.render();
      });
  }

  setupEventListeners() {
    document.addEventListener('click', (e) => {
      if (e.target.classList.contains('btn-delete')) {
        const eventId = e.target.dataset.id;
        if (confirm('Are you sure you want to delete this event?')) {
          this.deleteEvent(eventId);
        }
      }
    });
  }

  async deleteEvent(eventId) {
    try {
      const response = await fetch('../api/delete_event.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: eventId })
      });
      
      const data = await response.json();
      if (data.success) {
        this.showAlert('Event deleted successfully', 'success');
        this.events = this.events.filter(e => e.id !== eventId);
        this.render();
      } else {
        this.showAlert('Error deleting event', 'error');
      }
    } catch (error) {
      this.showAlert('Error deleting event', 'error');
    }
  }

  showAlert(message, type) {
    const alertContainer = document.getElementById('alertContainer');
    const alert = document.createElement('div');
    alert.className = `alert alert-${type}`;
    alert.textContent = message;
    alertContainer.appendChild(alert);
    
    setTimeout(() => alert.remove(), 3000);
  }

  filterEvents(filter) {
    this.currentFilter = filter;
    
    // Update button styles
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.style.background = btn.dataset.filter === filter ? '#1a1a1a' : 'white';
      btn.style.color = btn.dataset.filter === filter ? 'white' : '#1a1a1a';
    });

    // Filter events
    const now = new Date();
    if (filter === 'upcoming') {
      this.filteredEvents = this.events.filter(e => new Date(e.event_date) >= now);
    } else if (filter === 'past') {
      this.filteredEvents = this.events.filter(e => new Date(e.event_date) < now);
    } else {
      this.filteredEvents = this.events;
    }

    this.render();
  }

  render() {
    const tbody = document.getElementById('eventsTableBody');
    const eventsToDisplay = this.filteredEvents.length > 0 ? this.filteredEvents : this.events;
    
    if (eventsToDisplay.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 40px;">No events found</td></tr>';
      return;
    }

    tbody.innerHTML = eventsToDisplay.map(event => {
      const eventDate = new Date(event.event_date);
      const isUpcoming = eventDate >= new Date();
      const status = isUpcoming ? 'Upcoming' : 'Past';
      const statusBadge = isUpcoming ? 'upcoming' : 'past';

      return `
        <tr onclick="eventManagement.openModal(${event.id})" style="cursor: pointer;">
          <td><strong>${event.title}</strong></td>
          <td>${eventDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</td>
          <td>${event.location}</td>
          <td>${event.category}</td>
          <td><span class="badge ${statusBadge}">${status}</span></td>
          <td>${event.is_featured ? '<i class="ri-star-fill" style="color: #ff6b35;"></i>' : '-'}</td>
          <td onclick="event.stopPropagation();">
            <div class="action-buttons">
              <a href="edit-event.html?id=${event.id}" class="btn-edit"><i class="ri-edit-line"></i> Edit</a>
              <button class="btn-delete" data-id="${event.id}"><i class="ri-delete-line"></i> Delete</button>
            </div>
          </td>
        </tr>
      `;
    }).join('');
  }

  openModal(eventId) {
    const event = this.events.find(e => e.id == eventId);
    if (!event) return;

    const eventDate = new Date(event.event_date);
    const fullDateStr = eventDate.toLocaleDateString('en-US', { 
      weekday: 'long',
      year: 'numeric', 
      month: 'long', 
      day: 'numeric' 
    });

    const isUpcoming = eventDate >= new Date();
    const status = isUpcoming ? 'Upcoming' : 'Past';

    const content = document.getElementById('eventModalContent');
    content.innerHTML = `
      <h2 style="margin-bottom: 20px; font-size: 24px;">${event.title}</h2>
      
      <div style="margin-bottom: 20px;">
        <img src="${event.cover_image || '../assest/img-4.png'}" alt="${event.title}" style="width: 100%; height: 300px; object-fit: cover; border-radius: 8px;">
      </div>

      <div style="background: #f6f6eb; padding: 20px; border-radius: 8px; margin-bottom: 20px;">
        <div style="margin-bottom: 15px;">
          <label style="font-weight: 600; color: #1a1a1a;">Event Title</label>
          <p style="margin: 5px 0; color: #555;">${event.title}</p>
        </div>

        <div style="margin-bottom: 15px;">
          <label style="font-weight: 600; color: #1a1a1a;">Date</label>
          <p style="margin: 5px 0; color: #555;">${fullDateStr}</p>
        </div>

        <div style="margin-bottom: 15px;">
          <label style="font-weight: 600; color: #1a1a1a;">Time</label>
          <p style="margin: 5px 0; color: #555;">${event.event_time || 'N/A'} - ${event.event_end_time || 'N/A'}</p>
        </div>

        <div style="margin-bottom: 15px;">
          <label style="font-weight: 600; color: #1a1a1a;">Location</label>
          <p style="margin: 5px 0; color: #555;">${event.location}</p>
        </div>

        <div style="margin-bottom: 15px;">
          <label style="font-weight: 600; color: #1a1a1a;">Category</label>
          <p style="margin: 5px 0; color: #555;">${event.category || 'N/A'}</p>
        </div>

        <div style="margin-bottom: 15px;">
          <label style="font-weight: 600; color: #1a1a1a;">Status</label>
          <p style="margin: 5px 0; color: #555;">${status}</p>
        </div>

        <div style="margin-bottom: 15px;">
          <label style="font-weight: 600; color: #1a1a1a;">Featured</label>
          <p style="margin: 5px 0; color: #555;">${event.is_featured ? '✅ Yes' : '❌ No'}</p>
        </div>

        <div style="margin-bottom: 15px;">
          <label style="font-weight: 600; color: #1a1a1a;">Description</label>
          <p style="margin: 5px 0; color: #555; line-height: 1.6;">${event.description}</p>
        </div>

        <div style="margin-bottom: 15px;">
          <label style="font-weight: 600; color: #1a1a1a;">Cover Image URL</label>
          <p style="margin: 5px 0; color: #999; font-size: 12px; word-break: break-all;">${event.cover_image || 'N/A'}</p>
        </div>

        <div>
          <label style="font-weight: 600; color: #1a1a1a;">Event ID</label>
          <p style="margin: 5px 0; color: #999; font-size: 12px;">#${event.id}</p>
        </div>
      </div>

      <div style="display: flex; gap: 10px;">
        <a href="edit-event.html?id=${event.id}" class="btn-edit" style="flex: 1; text-align: center; padding: 12px; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px;">
          <i class="ri-edit-line"></i> Edit Event
        </a>
        <button onclick="eventManagement.deleteEvent(${event.id})" class="btn-delete" style="flex: 1; padding: 12px;">
          <i class="ri-delete-line"></i> Delete Event
        </button>
      </div>
    `;

    const modal = document.getElementById('eventModal');
    modal.style.display = 'flex';
  }

  closeModal() {
    const modal = document.getElementById('eventModal');
    modal.style.display = 'none';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  window.eventManagement = new EventsManagement();
});
</script>
</body>
</html>
