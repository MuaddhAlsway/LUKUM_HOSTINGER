<!DOCTYPE html>
<html>
<head>
    <title>Test Edit Event</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .test { margin: 20px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
    </style>
</head>
<body>
    <h1>Edit Event Diagnostic</h1>
    
    <div class="test">
        <h3>1. Check URL Parameters</h3>
        <div id="urlTest"></div>
    </div>
    
    <div class="test">
        <h3>2. Test API Call</h3>
        <div id="apiTest"></div>
    </div>
    
    <div class="test">
        <h3>3. Load Edit Event Page</h3>
        <button onclick="loadEditEvent()">Load Edit Event with ID=1</button>
        <div id="loadTest"></div>
    </div>

    <script>
        // Test 1: URL Parameters
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        document.getElementById('urlTest').innerHTML = `
            <p>Current URL: ${window.location.href}</p>
            <p>Event ID from URL: ${id || 'NOT PROVIDED'}</p>
            <p><a href="test-edit-event.html?id=1">Test with ID=1</a></p>
        `;
        
        // Test 2: API Call
        async function testAPI() {
            try {
                const response = await fetch('../api/get_event_details_simple.php?id=1');
                const data = await response.json();
                document.getElementById('apiTest').innerHTML = `
                    <p class="${data.success ? 'success' : 'error'}">
                        Status: ${data.success ? 'SUCCESS' : 'ERROR'}
                    </p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                document.getElementById('apiTest').innerHTML = `
                    <p class="error">Error: ${error.message}</p>
                `;
            }
        }
        
        testAPI();
        
        // Test 3: Load Edit Event
        function loadEditEvent() {
            window.location.href = 'edit-event.html?id=1';
        }
    </script>
</body>
</html>
