    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="admin-style.css">
    <link rel="stylesheet" href="../assest/popup-notification.css">
    <style>
        .sync-button {
            background: #17a2b8;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
            font-size: 14px;
        }
        .sync-button:hover {
            background: #138496;
        }
        .status-message {
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
            display: none;
        }
        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        .status-message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }
    </style>
</head>

<body>
    <div class="admin-container">
        <aside class="sidebar">
            <div class="logo">
                <h3 style="font-size: 24px; font-weight: 300; letter-spacing: 2px; margin: 0;">LAKUM</h3>
            </div>

            <div class="sidebar-lang-toggle">
                <a href="?lang=ar" class="sidebar-lang-btn">
                    <i class="ri-global-line"></i>
                    <span>العربية</span>
                </a>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="ri-dashboard-line"></i>
                    <span>Dashboard</span>
                </a>
                <a href="hero-manager.html" class="nav-item">
                    <i class="ri-image-line"></i>
                    <span>Hero Manager</span>
                </a>
                <a href="site-settings.html" class="nav-item">
                    <i class="ri-global-line"></i>
                    <span>Site Settings</span>
                </a>
                <a href="events.html" class="nav-item">
                    <i class="ri-calendar-event-line"></i>
                    <span>Events</span>
                </a>
                <a href="blogs.html" class="nav-item">
                    <i class="ri-article-line"></i>
                    <span>Blogs</span>
                </a>
                <a href="press.html" class="nav-item">
                    <i class="ri-newspaper-line"></i>
                    <span>Press</span>
                </a>
                <a href="pricing-working.html" class="nav-item active">
                    <i class="ri-price-tag-3-line"></i>
                    <span>Pricing</span>
                </a>
                <a href="legal-pages.html" class="nav-item">
                    <i class="ri-file-text-line"></i>
                    <span>Legal Pages</span>
                </a>
                <a href="settings.html" class="nav-item">
                    <i class="ri-settings-3-line"></i>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="login.html" class="logout-btn">
                    <i class="ri-logout-box-line"></i>
                    <span>Logout</span>
                </a>
            </div>
        </aside>

        <main class="main-content">
            <a href="https://lakumartspace.com" target="_blank" class="admin-floating-btn" title="View Website">
                <i class="ri-external-link-line"></i>
            </a>

            <header>
                <h1><i class="ri-price-tag-3-line"></i> Pricing</h1>
                <div>
                    <button class="sync-button" onclick="syncPricing()">
                        <i class="ri-refresh-line"></i> Sync Real Data
                    </button>
                    <a href="add-pricing.html" class="btn-primary"><i class="ri-add-line"></i> Add Pricing</a>
                </div>
            </header>

            <div id="statusMessage" class="status-message"></div>

            <div class="list-container">
                <div class="list-controls">
                </div>

                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Price</th>
                            <th>Unit</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="pricingTableBody">
                        <tr>
                            <td colspan="5" style="text-align: center; padding: 40px;">Loading pricing...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <style>
        /* Confirmation Modal Styles */
        .confirmation-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        .confirmation-modal.active {
            display: flex;
        }

        .confirmation-modal-content {
            background: white;
            border-radius: 8px;
            padding: 32px;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.3s ease;
        }

        .confirmation-modal-title {
            font-size: 20px;
            font-weight: 600;
            color: #1a1a1a;
            margin: 0 0 12px 0;
        }

        .confirmation-modal-message {
            font-size: 14px;
            color: #666;
            margin: 0 0 24px 0;
            line-height: 1.5;
        }

        .confirmation-modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .confirmation-modal-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .confirmation-modal-btn-cancel {
            background: #f0f0f0;
            color: #333;
        }

        .confirmation-modal-btn-cancel:hover {
            background: #e0e0e0;
        }

        .confirmation-modal-btn-confirm {
            background: #dc3545;
            color: white;
        }

        .confirmation-modal-btn-confirm:hover {
            background: #c82333;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>

    <div id="confirmationModal" class="confirmation-modal">
        <div class="confirmation-modal-content">
            <h2 class="confirmation-modal-title">Delete Pricing</h2>
            <p class="confirmation-modal-message">Are you sure you want to delete this pricing? This action cannot be undone.</p>
            <div class="confirmation-modal-actions">
                <button class="confirmation-modal-btn confirmation-modal-btn-cancel" onclick="closeConfirmationModal()">Cancel</button>
                <button class="confirmation-modal-btn confirmation-modal-btn-confirm" onclick="confirmDeletePricing()">Delete</button>
            </div>
        </div>
    </div>

    <script>
        let pricingToDelete = null;

        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = message;
            statusDiv.className = 'status-message ' + type;
            setTimeout(() => {
                statusDiv.className = 'status-message';
            }, 5000);
        }

        async function syncPricing() {
            showStatus('Syncing pricing data...', 'info');
            
            try {
                const response = await fetch('../api/delete-all-pricing-and-sync.php');
                const data = await response.json();
                
                if (data.success) {
                    showStatus('✓ Synced ' + data.inserted + ' pricing items successfully', 'success');
                    loadPricing();
                } else {
                    showStatus('✗ Error: ' + data.message, 'error');
                }
            } catch (error) {
                showStatus('✗ Error: ' + error.message, 'error');
            }
        }

        async function loadPricing() {
            try {
                const response = await fetch('../api/get_pricing.php');
                const data = await response.json();
                
                if (data.success && data.data && data.data.length > 0) {
                    const mappedData = data.data.map(item => ({
                        id: item.id,
                        name: item.title || item.name,
                        price: item.price,
                        currency: item.price_unit || 'SAR',
                        duration: item.price_sec || 'per day',
                        vat_note: item.vat_note,
                        is_active: item.is_active
                    }));
                    displayPricing(mappedData);
                } else {
                    displayNoPricingMessage();
                }
            } catch (error) {
                console.error('Error loading pricing:', error);
                displayNoPricingMessage();
            }
        }

        function displayPricing(items) {
            const tbody = document.getElementById('pricingTableBody');
            
            if (items.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 40px;">No pricing found. Click "Sync Real Data" to load pricing.</td></tr>';
                return;
            }

            tbody.innerHTML = items.map(item => `
                <tr>
                    <td>${item.name || item.title || '-'}</td>
                    <td>${item.price || '-'}</td>
                    <td>${item.currency || item.price_unit || '-'}</td>
                    <td><span class="badge ${item.is_active ? 'active' : 'inactive'}">${item.is_active ? 'Active' : 'Inactive'}</span></td>
                    <td>
                        <a href="edit-pricing.html?id=${item.id}" class="btn-small" style="background-color: #28a745; color: white; padding: 8px 12px; text-decoration: none; border-radius: 4px; display: inline-block;">Edit</a>
                        <button onclick="openConfirmationModal(${item.id})" class="btn-small btn-danger" style="background-color: #dc3545; color: white; padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer;">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function displayNoPricingMessage() {
            const tbody = document.getElementById('pricingTableBody');
            tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 40px;">No pricing found. Click "Sync Real Data" to load pricing.</td></tr>';
        }

        function openConfirmationModal(id) {
            pricingToDelete = id;
            document.getElementById('confirmationModal').classList.add('active');
        }

        function closeConfirmationModal() {
            pricingToDelete = null;
            document.getElementById('confirmationModal').classList.remove('active');
        }

        function confirmDeletePricing() {
            if (!pricingToDelete) return;

            const id = pricingToDelete;
            closeConfirmationModal();

            fetch(`../api/delete_pricing.php`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ id: id })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showStatus('✓ Pricing deleted successfully', 'success');
                    loadPricing();
                } else {
                    showStatus('✗ Error deleting pricing: ' + (data.message || 'Unknown error'), 'error');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showStatus('✗ Error deleting pricing', 'error');
            });
        }

        // Close modal when clicking outside
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('confirmationModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeConfirmationModal();
                }
            });
            
            loadPricing();
        });
    </script>
</body>

</html>
