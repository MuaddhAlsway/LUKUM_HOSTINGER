<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Blog - LAKUM</title>
    <link rel="icon" href="../../assest/favicon.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="admin-style.css">
    <link rel="stylesheet" href="event-form-style.css">
    <link rel="stylesheet" href="../assest/popup-notification.css">
    <style>
        #blog-editor {
            width: 100%;
            min-height: 400px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="admin-container">
        <aside class="sidebar">
            <div class="logo">
                <h3 style="font-size: 24px; font-weight: 300; letter-spacing: 2px; margin: 0;">LAKUM</h3>
            </div>

            <div class="sidebar-lang-toggle">
                <a href="?lang=ar" class="sidebar-lang-btn">
                    <i class="ri-global-line"></i>
                    <span>العربية</span>
                </a>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="ri-dashboard-line"></i>
                    <span>Dashboard</span>
                </a>
                <a href="hero-manager.html" class="nav-item">
                    <i class="ri-image-line"></i>
                    <span>Hero Manager</span>
                </a>
                <a href="site-settings.html" class="nav-item">
                    <i class="ri-global-line"></i>
                    <span>Site Settings</span>
                </a>
                <a href="events.html" class="nav-item">
                    <i class="ri-calendar-event-line"></i>
                    <span>Events</span>
                </a>
                <a href="blogs.html" class="nav-item active">
                    <i class="ri-article-line"></i>
                    <span>Blogs</span>
                </a>
                <a href="press.html" class="nav-item">
                    <i class="ri-newspaper-line"></i>
                    <span>Press</span>
                </a>
                <a href="pricing.html" class="nav-item">
                    <i class="ri-price-tag-3-line"></i>
                    <span>Pricing</span>
                </a>
                <a href="legal-pages.html" class="nav-item">
                    <i class="ri-file-text-line"></i>
                    <span>Legal Pages</span>
                </a>
                <a href="settings.html" class="nav-item">
                    <i class="ri-settings-3-line"></i>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="login.html" class="logout-btn">
                    <i class="ri-logout-box-line"></i>
                    <span>Logout</span>
                </a>
            </div>
        </aside>

        <main class="main-content">
            <a href="https://lakumartspace.com" target="_blank" class="admin-floating-btn" title="View Website">
                <i class="ri-external-link-line"></i>
            </a>

            <header>
                <h1><i class="ri-edit-line"></i> Edit Blog</h1>
                <a href="blogs.html" class="btn-secondary"><i class="ri-arrow-left-line"></i> Back</a>
            </header>

            <div class="modern-form-container">
                <form method="POST" enctype="multipart/form-data" id="blogForm">
                    <input type="hidden" name="id" id="blogId">

                    <!-- Cover Image Section -->
                    <div class="cover-upload-section">
                        <div class="cover-preview" id="coverPreview">
                            <div class="cover-placeholder">
                                <i class="ri-image-add-line"></i>
                                <p>Click to upload cover image</p>
                                <span>Recommended: 1200x800px</span>
                            </div>
                            <img id="coverImg" style="display: none;">
                            <button type="button" class="remove-cover" id="removeCover" style="display: none;">
                                <i class="ri-close-line"></i>
                            </button>
                        </div>
                        <input type="file" id="cover_image" name="cover_image" accept="image/*,.jpg,.jpeg,.png,.gif,.webp,.heic,.heif" style="display: none;">
                    </div>

                    <!-- Blog Details -->
                    <div class="form-section">
                        <h3><i class="ri-information-line"></i> Blog Details</h3>

                        <!-- English Section -->
                        <div style="background: #f9f9f9; padding: 20px; border-radius: 8px; margin-bottom: 30px; border-left: 4px solid #000;">
                            <h4 style="margin: 0 0 16px 0; font-size: 1rem; font-weight: 600;">English</h4>
                            
                            <div class="form-group">
                                <label for="title_en">Blog Title (EN) *</label>
                                <input type="text" id="title_en" name="title_en" placeholder="Enter blog title in English" required>
                            </div>

                            <div class="form-group">
                                <label for="content_en">Content (EN) *</label>
                                <textarea id="content_en" name="content_en" rows="8" placeholder="Write your blog content in English..." required></textarea>
                                <div class="char-count"><span id="charCount_en">0</span> characters</div>
                            </div>

                            <div class="form-group">
                                <label for="excerpt_en">Excerpt (EN)</label>
                                <textarea id="excerpt_en" name="excerpt_en" rows="3" placeholder="Brief summary in English..."></textarea>
                            </div>
                        </div>

                        <!-- Arabic Section -->
                        <div style="background: #f9f9f9; padding: 20px; border-radius: 8px; margin-bottom: 30px; border-left: 4px solid #999;">
                            <h4 style="margin: 0 0 16px 0; font-size: 1rem; font-weight: 600;">العربية</h4>
                            
                            <div class="form-group">
                                <label for="title_ar">Blog Title (AR) *</label>
                                <input type="text" id="title_ar" name="title_ar" placeholder="أدخل عنوان المدونة بالعربية" required>
                            </div>

                            <div class="form-group">
                                <label for="content_ar">Content (AR) *</label>
                                <textarea id="content_ar" name="content_ar" rows="8" placeholder="اكتب محتوى مدونتك بالعربية..." required dir="rtl"></textarea>
                                <div class="char-count"><span id="charCount_ar">0</span> characters</div>
                            </div>

                            <div class="form-group">
                                <label for="excerpt_ar">Excerpt (AR)</label>
                                <textarea id="excerpt_ar" name="excerpt_ar" rows="3" placeholder="ملخص موجز بالعربية..." dir="rtl"></textarea>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="author">Author</label>
                            <input type="text" id="author" name="author" placeholder="Enter author name">
                        </div>

                        <div class="form-group">
                            <label for="category">Category *</label>
                            <select id="category" name="category" required>
                                <option value="">Select a category</option>
                                <option value="Art & Culture" data-i18n="blog_category_art_culture">Art & Culture</option>
                                <option value="Exhibition" data-i18n="blog_category_exhibition">Exhibition</option>
                                <option value="Community" data-i18n="blog_category_community">Community</option>
                                <option value="News" data-i18n="blog_category_news">News</option>
                                <option value="Tutorial" data-i18n="blog_category_tutorial">Tutorial</option>
                                <option value="Behind the Scenes" data-i18n="blog_category_behind_scenes">Behind the Scenes</option>
                            </select>
                        </div>

                    <!-- Form Actions -->
                    <div class="form-actions-modern">
                        <button type="submit" class="btn-primary-modern" id="submitBtn">
                            <i class="ri-check-line"></i> Update
                        </button>
                        <a href="blogs.html" class="btn-secondary-modern">
                            <i class="ri-close-line"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="config.js"></script>
    <script src="form-reset.js"></script>
    <script src="../assest/popup-notification.js?v=5.0.0" defer></script>

    <script>
        console.log('=== EDIT BLOG PAGE LOADED ===');
        
        // Translate category options
        function translateCategoryOptions() {
            const categorySelect = document.getElementById('category');
            const options = categorySelect.querySelectorAll('option[data-i18n]');
            
            options.forEach(option => {
                const key = option.getAttribute('data-i18n');
                if (window.translations && window.translations[key]) {
                    option.textContent = window.translations[key];
                }
            });
        }
        
        // Call translation after page load
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(translateCategoryOptions, 100);
        });
        
        // Also translate when language changes
        window.addEventListener('languageChanged', () => {
            setTimeout(translateCategoryOptions, 100);
        });

        // Get blog ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const blogId = urlParams.get('id');

        console.log('Blog ID from URL:', blogId);

        // Cover Image Upload Handler
        const coverPreview = document.getElementById('coverPreview');
        const coverInput = document.getElementById('cover_image');
        const coverImg = document.getElementById('coverImg');
        const removeCoverBtn = document.getElementById('removeCover');

        if (coverPreview && coverInput) {
            coverPreview.addEventListener('click', () => {
                coverInput.click();
            });

            coverInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        coverImg.src = e.target.result;
                        coverImg.style.display = 'block';
                        if (removeCoverBtn) {
                            removeCoverBtn.style.display = 'flex';
                        }
                        const placeholder = coverPreview.querySelector('.cover-placeholder');
                        if (placeholder) {
                            placeholder.style.display = 'none';
                        }
                    };
                    reader.readAsDataURL(file);
                }
            });

            if (removeCoverBtn) {
                removeCoverBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    coverInput.value = '';
                    coverImg.style.display = 'none';
                    coverImg.src = '';
                    removeCoverBtn.style.display = 'none';
                    const placeholder = coverPreview.querySelector('.cover-placeholder');
                    if (placeholder) {
                        placeholder.style.display = 'flex';
                    }
                });
            }
        }

        // Fetch and populate blog data
        if (blogId) {
            console.log('Fetching blog data for ID:', blogId);
            
            fetch(getApiUrl('get_blog_details_fixed.php?id=' + blogId))
                .then(response => {
                    console.log('Response status:', response.status);
                    return response.json();
                })
                .then(data => {
                    console.log('API Response:', data);
                    
                    if (data.success && data.data) {
                        const blog = data.data;
                        console.log('Blog data received:', blog);
                        
                        // Set form values - use language-specific fields from translations
                        console.log('Setting form fields...');
                        document.getElementById('blogId').value = blog.id || '';
                        document.getElementById('title_en').value = blog.title_en || '';
                        document.getElementById('title_ar').value = blog.title_ar || '';
                        document.getElementById('content_en').value = blog.content_en || '';
                        document.getElementById('content_ar').value = blog.content_ar || '';
                        document.getElementById('excerpt_en').value = blog.excerpt_en || '';
                        document.getElementById('excerpt_ar').value = blog.excerpt_ar || '';
                        document.getElementById('author').value = blog.author || '';
                        document.getElementById('category').value = blog.category || '';
                        
                        // Update character counts
                        document.getElementById('charCount_en').textContent = (blog.content_en || '').length;
                        document.getElementById('charCount_ar').textContent = (blog.content_ar || '').length;
                        
                        console.log('Form fields populated successfully');
                        
                        // Set cover image
                        if (blog.cover_image) {
                            const img = document.getElementById('coverImg');
                            let imagePath = blog.cover_image;
                            if (!imagePath.startsWith('http') && !imagePath.startsWith('../')) {
                                imagePath = '../' + imagePath;
                            }
                            img.src = imagePath;
                            img.style.display = 'block';
                            const placeholder = document.querySelector('.cover-placeholder');
                            if (placeholder) placeholder.style.display = 'none';
                            if (removeCoverBtn) removeCoverBtn.style.display = 'flex';
                            console.log('Cover image set:', imagePath);
                        }
                    } else {
                        console.error('Error:', data.error);
                        showPopup('Blog not found: ' + (data.error || 'Unknown error'), 'error');
                        setTimeout(() => window.location.href = 'blogs.html', 1500);
                    }
                })
                .catch(error => {
                    console.error('Fetch error:', error);
                    showPopup('Error loading blog: ' + error.message, 'error');
                    setTimeout(() => window.location.href = 'blogs.html', 1500);
                });
        } else {
            showPopup('No blog ID provided', 'error');
            setTimeout(() => window.location.href = 'blogs.html', 1500);
        }

        // Handle form submission
        document.getElementById('blogForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            console.log('=== FORM SUBMISSION STARTED ===');
            
            // Validate required fields
            const title_en = document.getElementById('title_en').value.trim();
            const title_ar = document.getElementById('title_ar').value.trim();
            const content_en = document.getElementById('content_en').value.trim();
            const content_ar = document.getElementById('content_ar').value.trim();
            
            if (!title_en) {
                showPopup('Blog title (English) is required', 'error');
                return;
            }
            if (!title_ar) {
                showPopup('Blog title (Arabic) is required', 'error');
                return;
            }
            if (!content_en) {
                showPopup('Blog content (English) is required', 'error');
                return;
            }
            if (!content_ar) {
                showPopup('Blog content (Arabic) is required', 'error');
                return;
            }
            
            // Handle image upload
            let coverImagePath = null;
            const fileInput = document.getElementById('cover_image');
            
            if (fileInput.files && fileInput.files[0]) {
                console.log('File selected for upload:', fileInput.files[0].name);
                const file = fileInput.files[0];
                const formData = new FormData();
                formData.append('file', file);
                
                try {
                    console.log('Uploading image...');
                    const uploadResponse = await fetch(getApiUrl('upload_cover_image.php'), {
                        method: 'POST',
                        body: formData
                    });
                    
                    const uploadResult = await uploadResponse.json();
                    console.log('Upload response:', uploadResult);
                    
                    if (uploadResult.success) {
                        coverImagePath = uploadResult.path;
                        console.log('Image uploaded successfully:', coverImagePath);
                    } else {
                        console.error('Image upload failed:', uploadResult.message);
                        showPopup('Image upload failed: ' + uploadResult.message, 'error');
                        return;
                    }
                } catch (error) {
                    console.error('Image upload error:', error);
                    showPopup('Error uploading image: ' + error.message, 'error');
                    return;
                }
            }

            const updatedBlog = {
                id: document.getElementById('blogId').value,
                title_en: title_en,
                title_ar: title_ar,
                content_en: content_en,
                content_ar: content_ar,
                excerpt_en: document.getElementById('excerpt_en').value.trim(),
                excerpt_ar: document.getElementById('excerpt_ar').value.trim(),
                author: document.getElementById('author').value.trim(),
                category: document.getElementById('category').value
            };
            
            // Only include cover_image if it was updated
            if (coverImagePath !== null) {
                updatedBlog.cover_image = coverImagePath;
            }

            console.log('Submitting blog:', updatedBlog);

            try {
                const response = await fetch(getApiUrl('edit_blog_simple.php'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(updatedBlog)
                });

                const result = await response.json();
                console.log('Update response:', result);
                
                if (result.success) {
                    showPopup('Blog updated successfully!', 'success');
                    setTimeout(() => {
                        window.location.href = 'blogs.html';
                    }, 1500);
                } else {
                    showPopup('Error: ' + (result.message || 'Failed to update blog'), 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showPopup('Error: ' + error.message, 'error');
            }
        });
    </script>
</body>

</html>
