<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test Tool</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>LAKUM API Test Tool</h1>
    
    <div class="section">
        <h2>Step 1: Check Database</h2>
        <button onclick="checkDatabase()">Check Database Status</button>
        <pre id="dbResult"></pre>
    </div>
    
    <div class="section">
        <h2>Step 2: Test API with ID</h2>
        <input type="number" id="testId" placeholder="Enter Exhibition/Event ID" value="1">
        <button onclick="testAPI()">Test API</button>
        <pre id="apiResult"></pre>
    </div>
    
    <div class="section">
        <h2>Step 3: Direct Query Test</h2>
        <button onclick="checkDirectAPI()">Check Debug API</button>
        <pre id="debugResult"></pre>
    </div>

    <script>
        async function checkDatabase() {
            try {
                const response = await fetch('/api/debug_api_error.php');
                const data = await response.json();
                document.getElementById('dbResult').textContent = JSON.stringify(data, null, 2);
            } catch (e) {
                document.getElementById('dbResult').innerHTML = `<span class="error">Error: ${e.message}</span>`;
            }
        }
        
        async function testAPI() {
            const id = document.getElementById('testId').value;
            try {
                const response = await fetch(`/api/get_event_details.php?id=${id}&lang=en`);
                const text = await response.text();
                
                try {
                    const data = JSON.parse(text);
                    const resultDiv = document.getElementById('apiResult');
                    if (data.success) {
                        resultDiv.innerHTML = `<span class="success">SUCCESS</span>\n${JSON.stringify(data, null, 2)}`;
                    } else {
                        resultDiv.innerHTML = `<span class="error">FAILED</span>\n${JSON.stringify(data, null, 2)}`;
                    }
                } catch (e) {
                    document.getElementById('apiResult').innerHTML = `<span class="error">Invalid JSON Response:</span>\n${text}`;
                }
            } catch (e) {
                document.getElementById('apiResult').innerHTML = `<span class="error">Error: ${e.message}</span>`;
            }
        }
        
        async function checkDirectAPI() {
            try {
                const response = await fetch('/api/debug_api_error.php');
                const data = await response.json();
                document.getElementById('debugResult').textContent = JSON.stringify(data, null, 2);
            } catch (e) {
                document.getElementById('debugResult').innerHTML = `<span class="error">Error: ${e.message}</span>`;
            }
        }
    </script>
</body>
</html>
