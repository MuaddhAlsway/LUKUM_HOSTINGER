<!DOCTYPE html>
<html>
<head>
    <title>Video Display Test</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f6f6eb; }
        h1 { color: #1a1a1a; }
        .test-section { background: white; padding: 20px; margin: 20px 0; border-radius: 4px; }
        .test-result { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        button { padding: 10px 20px; margin: 10px 0; cursor: pointer; font-size: 16px; }
        pre { background: #f4f4f4; padding: 10px; overflow-x: auto; }
        
        /* Same CSS as event-detail.css */
        .event-section--video {
            background: #ffffff;
            padding: 60px 0;
            display: none;
        }
        
        .event-section--video.active {
            display: block !important;
        }
        
        .event-video-wrapper {
            position: relative;
            width: 100%;
            height: 700px;
            overflow: hidden;
            border-radius: 4px;
            background: #000;
        }
        
        .event-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 4px;
        }
        
        .event-section__title {
            font-size: 2.5rem;
            font-weight: 300;
            color: #1a1a1a;
            margin-bottom: 50px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>🎬 Video Display Test Page</h1>
    <p>This page tests if the video display functionality works correctly.</p>
    
    <div class="test-section">
        <h2>Test 1: Check Elements</h2>
        <button onclick="testElements()">Run Test</button>
        <div id="test1-result"></div>
    </div>
    
    <div class="test-section">
        <h2>Test 2: Display Video Function</h2>
        <input type="text" id="videoUrl" placeholder="Enter YouTube URL" style="width: 100%; padding: 10px; margin: 10px 0;" 
               value="https://youtu.be/JH3zXmuFARw">
        <button onclick="testDisplayVideo()">Test displayVideo() Function</button>
        <div id="test2-result"></div>
    </div>
    
    <div class="test-section">
        <h2>Test 3: Video Section (Should appear below)</h2>
        <section class="event-section event-section--video" id="videoSection">
            <div style="max-width: 1400px; margin: 0 auto; padding: 0 20px;">
                <h2 class="event-section__title">Event Video</h2>
                <div class="event-video-wrapper" id="event-video-wrapper">
                    <iframe id="event-video" class="event-video" frameborder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen></iframe>
                </div>
            </div>
        </section>
    </div>
    
    <div class="test-section">
        <h2>Test 4: Console Output</h2>
        <div id="console-output" style="background: black; color: #00ff00; padding: 15px; font-family: monospace; height: 300px; overflow-y: auto;"></div>
        <button onclick="clearConsole()">Clear Console</button>
    </div>
    
    <script>
        // Redirect console.log to page
        const consoleDiv = document.getElementById('console-output');
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog.apply(console, args);
            const message = args.map(arg => 
                typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
            ).join(' ');
            consoleDiv.innerHTML += message + '<br>';
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        };
        
        function testElements() {
            const result = document.getElementById('test1-result');
            let html = '';
            
            const videoSection = document.getElementById('videoSection');
            const videoFrame = document.getElementById('event-video');
            
            html += `<div class="test-result ${videoSection ? 'success' : 'error'}">
                ✓ videoSection element found: ${!!videoSection}
            </div>`;
            
            html += `<div class="test-result ${videoFrame ? 'success' : 'error'}">
                ✓ videoFrame element found: ${!!videoFrame}
            </div>`;
            
            if (videoSection) {
                html += `<div class="test-result info">
                    Element ID: ${videoSection.id}<br>
                    Element class: ${videoSection.className}<br>
                    Display style: ${window.getComputedStyle(videoSection).display}
                </div>`;
            }
            
            result.innerHTML = html;
        }
        
        function testDisplayVideo() {
            const videoUrl = document.getElementById('videoUrl').value;
            const result = document.getElementById('test2-result');
            let html = '';
            
            console.log('📺 Testing displayVideo() with:', videoUrl);
            
            if (!videoUrl) {
                html = '<div class="test-result error">Error: No URL provided</div>';
                result.innerHTML = html;
                return;
            }
            
            displayVideo(videoUrl);
            
            setTimeout(() => {
                const videoSection = document.getElementById('videoSection');
                const videoFrame = document.getElementById('event-video');
                
                html += `<div class="test-result ${videoFrame && videoFrame.src ? 'success' : 'error'}">
                    ✓ iframe src set: ${videoFrame.src ? 'YES - ' + videoFrame.src : 'NO'}
                </div>`;
                
                html += `<div class="test-result ${videoSection.classList.contains('active') ? 'success' : 'error'}">
                    ✓ active class added: ${videoSection.classList.contains('active') ? 'YES' : 'NO'}
                </div>`;
                
                html += `<div class="test-result ${window.getComputedStyle(videoSection).display === 'block' ? 'success' : 'error'}">
                    ✓ display style is block: ${window.getComputedStyle(videoSection).display === 'block' ? 'YES' : 'NO'}
                </div>`;
                
                result.innerHTML = html;
            }, 100);
        }
        
        function displayVideo(videoUrl) {
            console.log('🎬 === displayVideo CALLED ===');
            console.log('videoUrl:', videoUrl);
            
            const videoSection = document.getElementById('videoSection');
            const videoFrame = document.getElementById('event-video');
            
            if (!videoSection) {
                console.error('❌ videoSection not found');
                return;
            }
            
            if (!videoFrame) {
                console.error('❌ videoFrame not found');
                return;
            }
            
            let embedUrl = '';
            
            if (videoUrl.includes('youtube.com') || videoUrl.includes('youtu.be')) {
                const match = videoUrl.match(/youtu\.be\/([a-zA-Z0-9_-]+)/);
                if (match) {
                    embedUrl = `https://www.youtube.com/embed/${match[1]}`;
                } else {
                    const url = new URL(videoUrl);
                    const videoId = url.searchParams.get('v');
                    if (videoId) {
                        embedUrl = `https://www.youtube.com/embed/${videoId}`;
                    }
                }
            }
            
            if (embedUrl) {
                console.log('✅ Setting src to:', embedUrl);
                videoFrame.src = embedUrl;
                videoSection.style.display = 'block';
                videoSection.classList.add('active');
                console.log('✅ Video section should now be visible!');
            } else {
                console.error('❌ Could not generate embed URL');
            }
        }
        
        function clearConsole() {
            document.getElementById('console-output').innerHTML = '';
        }
        
        // Run tests on load
        window.onload = function() {
            console.log('🚀 Test page loaded');
            testElements();
        };
    </script>
</body>
</html>
