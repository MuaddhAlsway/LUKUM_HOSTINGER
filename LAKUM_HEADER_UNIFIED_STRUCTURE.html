<!-- ========================================
     LAKUM ARTSPACE - Unified Header Structure
     Complete HTML template for all pages
     ======================================== -->

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lakum Artspace</title>
    
    <!-- ===== CRITICAL: Load unified header CSS FIRST ===== -->
    <!-- This overrides all previous header/nav CSS -->
    <link rel="stylesheet" href="lakum-header-unified.css">
    
    <!-- Other page-specific CSS (loaded after header CSS) -->
    <!-- <link rel="stylesheet" href="page-specific.css"> -->
</head>
<body>
    <!-- ===== SKIP TO MAIN CONTENT (Accessibility) ===== -->
    <a href="#main-content" class="lakum-skip-link">Skip to main content</a>

    <!-- ===== HEADER ===== -->
    <header class="lakum-header" role="banner">
        <div class="lakum-header__container">
            
            <!-- Logo -->
            <div class="lakum-header__logo">
                <a href="/" class="lakum-logo" aria-label="Lakum Artspace Home">
                    <img 
                        src="/path/to/logo-left.svg" 
                        alt="Lakum" 
                        class="lakum-logo__left"
                        loading="eager"
                    >
                    <img 
                        src="/path/to/logo-right.svg" 
                        alt="Artspace" 
                        class="lakum-logo__right"
                        loading="eager"
                    >
                </a>
            </div>

            <!-- Desktop Navigation -->
            <nav class="lakum-nav" role="navigation" aria-label="Main navigation">
                <ul class="lakum-nav__list">
                    <li class="lakum-nav__item">
                        <a href="/" class="lakum-nav__link">Home</a>
                    </li>
                    <li class="lakum-nav__item">
                        <a href="/about" class="lakum-nav__link">About</a>
                    </li>
                    <li class="lakum-nav__item">
                        <a href="/exhibitions" class="lakum-nav__link">Exhibitions</a>
                    </li>
                    <li class="lakum-nav__item">
                        <a href="/events" class="lakum-nav__link">Events</a>
                    </li>
                    <li class="lakum-nav__item">
                        <a href="/spaces" class="lakum-nav__link">Spaces</a>
                    </li>
                    <li class="lakum-nav__item">
                        <a href="/blog" class="lakum-nav__link">Blog</a>
                    </li>
                    <li class="lakum-nav__item">
                        <a href="/contact" class="lakum-nav__link">Contact</a>
                    </li>
                </ul>
            </nav>

            <!-- Language Switcher -->
            <div class="lakum-language-switcher" role="region" aria-label="Language selection">
                <a href="?lang=en" class="lakum-lang-link" aria-label="Switch to English">
                    <span class="lakum-lang-text">EN</span>
                </a>
                <a href="?lang=ar" class="lakum-lang-link" aria-label="Switch to Arabic">
                    <span class="lakum-lang-text">AR</span>
                </a>
            </div>

            <!-- Mobile Toggle Button -->
            <button 
                class="lakum-header__mobile-toggle" 
                aria-expanded="false"
                aria-label="Toggle navigation menu"
                aria-controls="lakum-nav-mobile"
            >
                <span class="lakum-header__mobile-icon"></span>
            </button>
        </div>
    </header>

    <!-- ===== MOBILE NAVIGATION (Off-canvas) ===== -->
    <nav class="lakum-nav--mobile" id="lakum-nav-mobile" role="navigation" aria-label="Mobile navigation">
        <ul class="lakum-nav__list">
            <li class="lakum-nav__item">
                <a href="/" class="lakum-nav__link">Home</a>
            </li>
            <li class="lakum-nav__item">
                <a href="/about" class="lakum-nav__link">About</a>
            </li>
            <li class="lakum-nav__item">
                <a href="/exhibitions" class="lakum-nav__link">Exhibitions</a>
            </li>
            <li class="lakum-nav__item">
                <a href="/events" class="lakum-nav__link">Events</a>
            </li>
            <li class="lakum-nav__item">
                <a href="/spaces" class="lakum-nav__link">Spaces</a>
            </li>
            <li class="lakum-nav__item">
                <a href="/blog" class="lakum-nav__link">Blog</a>
            </li>
            <li class="lakum-nav__item">
                <a href="/contact" class="lakum-nav__link">Contact</a>
            </li>
        </ul>
    </nav>

    <!-- ===== MAIN CONTENT ===== -->
    <main id="main-content" role="main">
        <!-- Page content goes here -->
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="lakum-footer" role="contentinfo">
        <!-- Footer content -->
    </footer>

    <!-- ===== SCRIPTS ===== -->
    <!-- Load unified header JS -->
    <script src="lakum-header-unified.js"></script>
    
    <!-- Optional: Set active nav link on page load -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (window.LakumHeader) {
                window.LakumHeader.setActiveLink();
            }
        });
    </script>
</body>
</html>

<!-- ========================================
     IMPLEMENTATION NOTES
     ======================================== -->

<!--
1. CSS LOADING ORDER:
   - Load lakum-header-unified.css FIRST (before any other CSS)
   - This ensures all header styles override previous conflicting CSS
   - All rules use !important to guarantee override

2. MOBILE NAVIGATION:
   - Desktop nav (.lakum-nav) is hidden on mobile via CSS
   - Mobile nav (.lakum-nav--mobile) is shown on mobile via CSS
   - Both contain identical nav items for consistency

3. LANGUAGE SWITCHER:
   - Positioned in header on desktop
   - Positioned absolutely on mobile (top-right)
   - Supports RTL (right-to-left) languages

4. ACCESSIBILITY:
   - aria-expanded on toggle button (true/false)
   - aria-label on all interactive elements
   - aria-current="page" on active nav link
   - Skip to main content link
   - Semantic HTML (header, nav, main, footer)
   - Keyboard navigation (ESC to close nav)

5. RTL SUPPORT:
   - Add dir="rtl" to <html> tag for Arabic
   - CSS automatically handles RTL layout
   - Language switcher repositions correctly

6. RESPONSIVE BREAKPOINTS:
   - Desktop: > 1024px (80px header)
   - Tablet: 768px - 1024px (70px header)
   - Mobile: < 768px (60px header)
   - Small mobile: < 480px (60px header, smaller fonts)

7. Z-INDEX HIERARCHY (CRITICAL):
   - Header: 1000
   - Overlay: 9999
   - Nav content: 10000
   - Toggle: 10001
   - Never conflicts with other page elements

8. JAVASCRIPT FEATURES:
   - Mobile nav toggle with aria-expanded
   - Close on outside click (overlay click)
   - Close on ESC key
   - Prevent body scroll when nav open
   - Auto-set active nav link
   - Public API: window.LakumHeader

9. BODY PADDING:
   - Automatically added via CSS
   - Prevents content from hiding under fixed header
   - Responsive: changes with header height

10. FUTURE-PROOF:
    - No dependencies on previous CSS files
    - Works even if old CSS is removed
    - All styles scoped to .lakum-* classes
    - No conflicts with page-specific CSS
    - Extensible via CSS custom properties

11. DEPLOYMENT:
    - Replace old lakum-components.css with lakum-header-unified.css
    - Replace old lakum-header.css with lakum-header-unified.css
    - Add lakum-header-unified.js to all pages
    - Update HTML structure to match this template
    - Test on all breakpoints and browsers
    - Test RTL (Arabic) layout

12. TESTING CHECKLIST:
    ✓ Desktop nav displays horizontally
    ✓ Mobile nav slides from left (or right for RTL)
    ✓ Toggle button transforms to X when open
    ✓ Overlay appears when nav open
    ✓ Nav closes on outside click
    ✓ Nav closes on ESC key
    ✓ Active link highlighted
    ✓ Hover states work
    ✓ RTL layout correct
    ✓ Responsive at all breakpoints
    ✓ Keyboard navigation works
    ✓ No layout shifts
    ✓ No z-index conflicts
    ✓ No CSS conflicts with page content
-->
